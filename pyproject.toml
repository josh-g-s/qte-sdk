[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[project]
name = "qte-sdk"
dynamic = ["version"]
description = "Python client SDK for the Queen's Tower Exchange"
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
requires-python = ">=3.11"
dependencies = [
    "protobuf>=6.33.6,<7",
]
classifiers = [
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3 :: Only",
    "License :: OSI Approved :: MIT License",
]

[project.optional-dependencies]
dev = [
    "pytest>=8",
    "ruff>=0.6",
    "build>=1.2",
]
codegen = [
    "grpcio-tools==1.80.0",
    "protobuf==6.33.6",
]

[project.urls]
Source = "https://github.com/josh-g-s/qte-sdk"

[tool.hatch.version]
path = "qte_sdk/__init__.py"

[tool.hatch.build.targets.wheel]
packages = ["qte_sdk"]

# An explicit allowlist, so untracked local files (such as .envrc) never reach a public sdist.
[tool.hatch.build.targets.sdist]
only-include = [
    "qte_sdk",
    "proto",
    "scripts",
    "tests",
    "docs",
    "README.md",
    "LICENSE",
    "pyproject.toml",
]

[tool.ruff]
line-length = 100
target-version = "py311"
extend-exclude = ["qte_sdk/contract/v1/*_pb2.py", "qte_sdk/contract/v1/*_pb2.pyi"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"
