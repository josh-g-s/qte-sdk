# The one place that records where the vendored contract came from.
# Written by scripts/vendor_contract.py; bump `commit` deliberately and re-run it.
# `approved`, when present, records who approved the pin and when, and `approved_commit`
# the commit approved; set both with `commit`. Re-vendoring another commit drops them.
# Each blob is the git blob hash of that file at `commit`, and CI checks the vendored
# bytes against it.

repo = "qte-platform"
commit = "e9d1b7a4171fc27f9d34bb2d1928595dcb98b7e8"
path = "schemas/proto/qte/contract/v1"

[blobs]
"common.proto" = "1830954c8d7160c40b8e74a74eb3c6e9e7254f81"
"envelope.proto" = "47c847d9b066383f4a08791186df86b521572b79"
"session.proto" = "df1e75a9ff90b9cd97d60bf9b9cf3cee040ee8b4"
"order_entry.proto" = "295d138b2157ac5319cfe4293dd90277de11219b"
"order_events.proto" = "c68230c3e1e4c712ad075d02125f5e96f044473c"
