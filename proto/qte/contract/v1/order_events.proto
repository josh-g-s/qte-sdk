// Outbound order events.
//
// **Version:** 1.26
//
// Message types on the envelope `type` field: `accepted`, `reject`,
// `execution`, `order_cancelled`, `order_state`, `account_summary`,
// `obligation_state`, `account_state`, `risk_notice`, and the
// ticket answers `ticket_accepted`, `ticket_reject` and `ticket_state` (see
// the end of this file). These are private to the team whose
// orders they concern. Each but `account_summary` and `obligation_state` is sent as
// soon as the engine records it, not held to the market-data publication grid
// (SPEC 4.3); `account_summary` is never sent unprompted and is sent only in
// reply to an `account_query`, and `obligation_state` is sent once per desk per
// whole-second close of a session.
// `account_state` is the reply to a team's `account_query` and is sent only in
// answer to one.
// Every `timestamp` field is a signed 64-bit count of milliseconds since the
// Unix epoch, UTC (SPEC 8.1, SPEC 9.2, SPEC 13.1), carried on the wire as a
// decimal string like every 64-bit field.
syntax = "proto3";

package qte.contract.v1;

import "qte/contract/v1/common.proto";

option go_package = "qte-platform/schemas/gen/go/qte/contract/v1;contractv1";

// The inbound message was released after delta_oe and applied (SPEC 8.1).
message Accepted {
  string request_ref = 1;     // id. Echoes the inbound message. Its rules are not yet specified
  RequestType request_type = 2; // NEW, CANCEL, AMEND or MASS_CANCEL. SPEC 8.2
  int64 receipt_time = 3;     // timestamp. Gateway receipt. SPEC 8.1
  int64 release_time = 4;     // timestamp. receipt_time plus delta_oe. SPEC 8.1
}

// One reject shape for every inbound message. Every reject carries one
// reason code from the registry (`common.proto`'s `ReasonCodes.ReasonCode`).
// When a reject is issued depends on where its check sits: a receipt-stage
// reject is sent at gateway receipt; a release-stage reject is logged at
// release (SPEC 9.4).
message Reject {
  // Required, except absent when the message could not be parsed far enough
  // to read one. Not yet specified.
  optional string request_ref = 1; // id
  // Required when the received `type` token is one of the enum values
  // (including ACCOUNT_QUERY for a rejected `account_query`); absent when it
  // is not, independently of request_ref. Not yet specified.
  optional RequestType request_type = 2;
  ReasonCodes.ReasonCode reason_code = 3; // Bands 1000-1600, and CURE_WINDOW. SPEC 8.1, SPEC 8.3, SPEC 11
  optional string reason_detail = 4;      // Free text, for example the risk limit that failed
  int64 receipt_time = 5;                 // timestamp. Gateway receipt. SPEC 8.1
  // Present iff reason_code = UNKNOWN_INSTRUMENT on a subscription. Not yet specified.
  optional string instrument = 6; // id
}

// One fill of one of the team's orders. Counterparty identity is never
// disclosed (SPEC 10). Every fill, fee and rebate an Execution ticket's child
// orders generate posts immediately to the originating Fundamentals pod's or
// house's own cash balance and position; a desk holds no separate ticket cash
// position of its own (SPEC 12.2, SPEC 24). A child order names its parent
// ticket in NewOrder.parent_ticket_id (SPEC 24.1), and a fill of a child
// carries that ticket's id in parent_ticket_id below. The report goes to the
// desk whose order was filled; the originating pod follows its ticket's
// fills in TicketState. A fill of a child of a ticket the automatic
// execution service works (origin AUTO_EXECUTION) goes to the originating
// pod instead, with parent_ticket_id and no strat_id.
message Execution {
  string exec_id = 1;  // id. Fill report identity. SPEC 8.2. Its format is not yet specified
  Origin origin = 2;   // SPEC 11.1, SPEC 11.2
  optional string strat_id = 3; // id. Required iff origin = TEAM. SPEC 2.5
  string instrument = 4;        // id. SPEC 8.2
  Side side = 5;                // The team's side. SPEC 8.2
  // Required iff the filled order is a limit order: the order's limit price,
  // whether the order was resting or filled on arrival.
  optional int64 order_price = 6; // int64-micro. SPEC 8.2
  int64 fill_price = 7;   // int64-micro. SPEC 5.3, SPEC 9.1, SPEC 9.3.1
  int64 fill_size = 8;    // int64-qty. SPEC 5.3, SPEC 9.3.3
  int64 remaining_size = 9; // int64-qty. 0 when filled. SPEC 8.2
  MatchKind fill_kind = 10; // Never RESIDUAL here. SPEC 10
  Liquidity liquidity = 11; // SPEC 12.1, SPEC 16.4
  // Signed cash flow to the team: negative taker fee, positive maker rebate,
  // 0 when neither applies. SPEC 12.1
  int64 fee = 12; // int64-micro
  int64 timestamp = 13; // timestamp. The execution event's sequencer timestamp. SPEC 9.2
  // Present iff the filled order is a child of a parent ticket: the
  // ticket_id of that ticket, in decimal digits. SPEC 24.1
  optional string parent_ticket_id = 14; // id
}

// One order of the team was cancelled with its remaining size unfilled:
// either removed from the book, or an aggressive order's unfilled remainder
// cancelled on arrival without ever resting.
message OrderCancelled {
  Origin origin = 1; // As on Execution. SPEC 11.2
  optional string strat_id = 2; // id. Required iff origin = TEAM. SPEC 2.5
  string instrument = 3;        // id. SPEC 8.2
  Side side = 4;                // SPEC 8.2
  // Required iff the order is a limit order: the order's limit price, also
  // for an aggressive order's remainder that was cancelled without resting.
  optional int64 price = 5; // int64-micro. SPEC 8.2
  int64 cancelled_size = 6; // int64-qty. The remaining size removed. SPEC 8.2
  ReasonCodes.ReasonCode reason_code = 7; // Band 1800. SPEC 8
  // Present iff reason_code is CANCEL_REQUEST, MASS_CANCEL or AMEND_CUT. Not yet specified.
  optional string request_ref = 8; // id
  int64 timestamp = 9; // timestamp. Sequencer timestamp of the cancellation. SPEC 9.2
}

// The current state of one order, identified by its instrument, side and
// price (a team holds at most one resting order there, SPEC 8.2). Sent when a
// new order's remainder rests, and for every amend the exchange accepts: one
// for each order the amend acts on, whether the amend leaves it resting or
// ends it. An amend's message carries old_price, so a client can remove the
// order from the price it left and, where it still rests, add it at price.
message OrderState {
  string strat_id = 1;   // id. SPEC 2.5
  string instrument = 2; // id. SPEC 8.2
  Side side = 3;          // SPEC 8.2
  // int64-micro. The order's price; after an amend, the amend's new price.
  // SPEC 8.2
  int64 price = 4;
  // RESTING or STALE while the order rests. After an amend that ends the
  // order: FILLED when the amend's execution at its new price filled it
  // completely, CANCELLED when the amend ended it any other way (the
  // matching order_cancelled gives the reason); remaining_size is then 0 and
  // nothing rests at price or at old_price. A STALE transition is never
  // reported to the owner, who recognises the band move from the book; the
  // purge that ends the order is reported as an OrderCancelled with
  // PURGE_STALE (SPEC 4.3, SPEC 8.4). PURGED is never sent here.
  OrderLifecycleState state = 5; // SPEC 8.4
  int64 remaining_size = 6;      // int64-qty. SPEC 8.2
  // Present iff state = STALE: when the order became STALE. SPEC 8.4
  optional int64 stale_since = 7; // timestamp
  int64 timestamp = 8; // timestamp. SPEC 9.2
  // Present iff this message reports an amend: the order's price before the
  // amend. Equal to price for an amend that changed only the size. When it
  // differs from price, the order no longer rests at old_price. SPEC 8.2
  optional int64 old_price = 9; // int64-micro
}

// One limit of the team's arm and how much of it is used (SPEC 11.1, Table 3).
// Both amounts are magnitudes in micro-dollars, so a client computes the
// utilisation as used over cap, and a limit is breached when used exceeds cap.
message LimitUtilisation {
  LimitKind kind = 1; // SPEC 11.1
  // The instrument, sector or underlying the row is for; absent for a
  // whole-book limit. An options underlying-and-expiry is named by the
  // underlying's symbol, one space and the expiry date in ISO 8601, for
  // example "SPY 2026-11-20": the underlying and expiry of an
  // OptionChainExpiry. SPEC 18.7
  optional string scope = 2;
  // int64-micro. The amount held, as a magnitude. For the Fundamentals entry
  // limits (LIMIT_INSTRUMENT, LIMIT_SECTOR, LIMIT_GROSS, LIMIT_SHORT_OF_GROSS)
  // it is the projected exposure: held shares plus the unfilled shares of
  // working increasing tickets, with no relief from working reducing tickets;
  // a row is sent for a name with only working tickets. LIMIT_INSTRUMENT_HARD
  // stays the filled position. For LIMIT_SHORT_OF_GROSS, used is held shorts
  // plus unfilled shares of increasing short tickets, and cap is 20% of the
  // filled gross alone (no unfilled ticket enters it, as at the ticket check).
  // LIMIT_GAMMA_DOLLAR is whole-book, sum of
  // abs(g_i); LIMIT_VEGA_UNDERLYING_AGGREGATE is abs(summed signed vega) of
  // an underlying against the longest live tenor's cap. SPEC 11.1, 18.7, 23.6
  int64 used = 3;
  int64 cap = 4;  // int64-micro. The limit's cap, fixed by the arm's equity in Table 3, not by live equity. SPEC 11.1
}

// A team's own account state: equity, cash, the day's profit and loss, where it
// stands against its daily loss limits, how much of each Table 3 limit of its
// arm it uses, and its exposure cure. Private to the team; it carries only the
// team's own information (SPEC 4.3, SPEC 15.4). It is sent only inside the
// `account_state` reply to an `account_query`, never unprompted. The message is
// self-contained so another message can carry it whole.
message AccountSummary {
  int64 equity = 1; // int64-micro. Live equity: cash plus positions at the official mark. SPEC 11.1
  int64 cash = 2;   // int64-micro. The team's cash balance. SPEC 12.2
  // int64-micro. The daily-loss reference: equity at the previous official
  // close, except that for Market Making, Market Taking and both Options
  // sub-arms in the first session of a new term it is the reset opening
  // equity (the new term's starting capital), not the prior term's closing
  // equity. Fundamentals is not reset. SPEC 11.1, SPEC 13.5, SPEC 15.1
  int64 previous_close_equity = 3;
  // Signed: equity minus previous_close_equity, realised and unrealised,
  // including overnight financing and dividends. Capital removed or supplied
  // by a term reset is not P&L. SPEC 11.1, SPEC 13.5
  int64 daily_pnl = 4; // int64-micro
  // Present iff the arm has a daily loss limit: the loss that raises the
  // warning, 60% of the halt amount. SPEC 11.1, Table 3
  optional int64 loss_warning_amount = 5; // int64-micro
  // Present iff the arm has a daily loss limit: the loss that starts the
  // halt, a percentage of the arm's fixed equity. SPEC 11.1, Table 3
  optional int64 loss_halt_amount = 6; // int64-micro
  LossLevel loss_level = 7; // SPEC 11.1
  // One row per whole-book limit of the arm, and one per instrument, sector or
  // underlying where the team holds a position. May be empty. SPEC 11.1, Table 3
  repeated LimitUtilisation limits = 8;
  bool in_cure = 9; // True while the team is in the 15-minute exposure cure. SPEC 11.2
  // Present iff in_cure: when the window ends. Set by the first breach and
  // never extended for a further breach; a scheduled session closure or a
  // declared exchange outage pauses it. SPEC 11.2
  optional int64 cure_deadline = 10; // timestamp
  // Present iff in_cure: true while the cure is paused, when cure_deadline is
  // the end the window would have if it resumed at this message's timestamp.
  // SPEC 11.2
  optional bool cure_paused = 11;
  int64 timestamp = 12; // timestamp. When the state was read. SPEC 9.2
}

// A market making desk's own quoting-obligation state: for each instrument
// assigned to it, its running two-sided presence in the current
// instrument-session, whether its latest second met the spread and size tests,
// and whether it is in the live Tier-M state (SPEC 16.2, SPEC 9.3.5). One
// message per desk per whole-second close of a session, sent right after
// SPEC 9.4.2 rank 1, with one entry for every instrument assigned to the desk;
// nothing is sent outside a session. Private to the desk it concerns and never
// on the public feed: it carries no other desk's information (SPEC 4.3,
// SPEC 15.4). It is defined for equity Market Making desks. Whether it also
// covers an Options market making desk, for its own obligated contracts under
// SPEC 18.5, is not yet confirmed. If it does, an entry names the contract by
// Alpaca's OCC option symbol, unpadded, in `instrument`.
message ObligationState {
  // One entry for every instrument assigned to the desk, in no required order.
  repeated ObligationEntry entries = 1;
  int64 timestamp = 2; // timestamp. The second close every entry is as of. SPEC 9.2, 9.4.2
}

// One assigned instrument's obligation state within an ObligationState.
message ObligationEntry {
  string instrument = 1; // The desk's assigned instrument. SPEC 16.1
  // Whether the second just closed is eligible time for this desk in this
  // instrument. False in the first five minutes of the session, during an
  // exchange suspension affecting the instrument, after the desk's own daily
  // loss halt, and in the term's final closing window; a 15-minute exposure
  // cure does not make it false. SPEC 16.2, 9.3.5, 13.3, 13.5
  bool eligible = 2;
  // Present iff eligible. Whether that second counted: both a non-stale
  // executable bid and offer existed, their full spread was at most 60% of the
  // band width in force, and the quantity displayed at each of those prices
  // met the minimum size. SPEC 16.2
  optional bool qualifying = 3;
  // Present iff eligible and the desk had both a non-stale executable bid and
  // offer. Whether the full quoted spread was at most 60% of the full
  // two-sided band width in force. SPEC 16.2, 5.2
  optional bool spread_compliant = 4;
  // Present iff eligible and the desk had both a non-stale executable bid and
  // offer. Whether the quantity displayed at the bid price and at the offer
  // price, each summed across the desk's orders at that price, independently
  // met the minimum size. Size at other prices does not count. SPEC 16.2
  optional bool size_compliant = 5;
  // Whole seconds. Qualifying seconds so far in the current instrument-session.
  // SPEC 16.2
  int32 session_qualifying_seconds = 6;
  // Whole seconds. Eligible seconds so far in the current instrument-session.
  // Presence is qualifying over eligible; no ratio is sent. SPEC 16.2
  int32 session_eligible_seconds = 7;
  // Whether the desk is in the live Tier-M state for this instrument: over the
  // trailing 900 seconds it qualified in at least 85% of that window's
  // eligible seconds. False with no eligible second yet, and for a desk under a
  // daily loss halt or a penalty suspension. SPEC 9.3.5, 16.2
  bool in_tier_m = 8;
  // Whole seconds. Qualifying seconds in the trailing 900-second window.
  // SPEC 9.3.5
  int32 tier_m_qualifying_seconds = 9;
  // Whole seconds. Eligible seconds in the same window. SPEC 9.3.5
  int32 tier_m_eligible_seconds = 10;
}

// SPEC 11.1. A team is told on this connection, when the engine records it,
// of the daily loss warning, a loss halt, a cure window opening and its
// deadline, a cure trade, the auto-flatten and the kill switch (SPEC 11.1,
// SPEC 15.4). Each has its own kind value.
message RiskNotice {
  RiskNoticeKind kind = 1; // SPEC 11.1
  int64 timestamp = 2;     // timestamp. SPEC 9.2
  // Present iff kind = CURE_WINDOW_OPENED: when the window's deadline
  // falls, as set by the first breach. A paused deadline (a scheduled closure,
  // a declared outage) sends no further notice. SPEC 11.2
  optional int64 cure_deadline = 3; // timestamp
  // Always present as an array (the shared encoder emits every field): empty
  // for every kind except CURE_WINDOW_OPENED, where it has at least one
  // element. The breached limits, one entry per limit, as at the moment the
  // window opened. SPEC 11.1, SPEC 11.2
  repeated LimitUtilisation breached_limits = 4;
}

// One position in an `account_state` reply (SPEC 7.1, SPEC 12.2).
message PositionValue {
  // id. The instrument held. An equity is named by its symbol; an option
  // contract by Alpaca's OCC option symbol, unpadded.
  string instrument = 1;
  // int64-qty. Signed: positive long, negative short. Shares of an equity; a
  // whole number of contracts for an option (SPEC 18.1).
  int64 quantity = 2;
  // int64-micro. The price the position is valued at: the instrument's
  // official mark inside a session once it has a valid one, its last official
  // close otherwise: outside a session, or inside one before the instrument's
  // first valid mark, while it is still reference unavailable (see
  // `AccountState.valuation_basis`). SPEC 7.1, SPEC 7.2
  int64 price = 3;
}

// Outbound. The reply to an `account_query`, sent to the asking team only,
// at any hour. It carries the team's own information and nothing of any other
// team's (SPEC 4.3, SPEC 15.4).
message AccountState {
  // id. Echoes the `account_query`'s request_ref, always present: a query
  // without one is rejected, so a reply always has one to echo.
  string request_ref = 1;
  // The team's equity, cash, daily loss and limit use, exactly the message
  // `account_summary` carries, defined once. Valued on this reply's
  // `valuation_basis`. Out of hours its previous_close_equity is the close
  // before the last one, so daily_pnl shows the session just finished.
  // Present iff the account is sent `account_summary`: absent for an
  // Execution desk and for the house, whose query is answered with the fields
  // that exist and not rejected. SPEC 11.1, SPEC 15.4, SPEC 24.3
  AccountSummary summary = 2;
  // Every instrument the team holds a nonzero position in, in ascending order
  // of `instrument`. Empty when the team holds no nonzero net position,
  // whether or not it has traded. A position is held by the
  // team, not by a strategy (SPEC 12.2). SPEC 7.1, SPEC 13.4
  repeated PositionValue positions = 3;
  // LIVE_MARK inside a session, LAST_OFFICIAL_CLOSE outside one. The basis for
  // `summary` and for every `positions` price. SPEC 7.1, SPEC 13.4
  ValuationBasis valuation_basis = 4;
  // The US trading date (ISO 8601). Inside a session, the current session's
  // date, even if no official close exists yet. Outside a session, the trading
  // date of the official close the values use, a break day's close included:
  // the date of the latest session's or break day's set of official closes. A
  // name that kept an older close because it had no valid mark in the latest
  // close window is part of that set, so one date covers the whole reply and
  // no position has a date of its own. On a break day, once that day's close
  // has run, it is that day's date and not the term's last session's; before
  // that close has run it is the date of the latest close that has. A
  // Fundamentals pod that queries before a term's first session, holding
  // positions carried over from the term before, gets the date of the latest
  // close that has run. After the competition's first session the date is
  // always present: if no name got an official close in that session it is
  // still that session's date, and a position with no official close ever is
  // valued at 0. Outside a session it is absent only before the competition's
  // first session, when the book is empty. Positions and `summary` are valued
  // at the same latest official close. SPEC 7.1, SPEC 13.1, SPEC 13.4,
  // SPEC 23.7
  optional string session_date = 5;
  // timestamp. The exchange's own timestamp of the state this reply reads, the
  // same instant as `summary.timestamp`. It does not order the reply against
  // the private reports: as_of_report_seq does. SPEC 9.2
  int64 as_of = 6;
  // int64-micro. The account's cash balance. Present only for an account that
  // holds a cash balance, and equal to `summary.cash` when `summary` is
  // present. The house's reply carries it; only an Execution desk's reply
  // omits it, because a desk holds no cash balance of its own. SPEC 12.2,
  // SPEC 24
  optional int64 cash = 7;
  // integer. The team's report_seq this reply reflects: the highest one the
  // team had been assigned when the state was read. The cut is for account
  // effects only: an execution or risk_notice at or below it is already in
  // cash, positions and summary, so its account effect is not applied again,
  // while accepted, reject, order_cancelled and order_state are still applied
  // whatever their report_seq (the reply holds no resting-order state). The
  // client's contiguous cursor and resume rules are unchanged. Absent when the
  // team has had no private report in this term, so a client applies every
  // one. The reply itself carries no report_seq.
  optional int64 as_of_report_seq = 8;
}

// The three ticket answers below, `ticket_accepted`, `ticket_reject` and
// `ticket_state`.
//
// None of them carries a report_seq or is replayed by a resume. A pod or a
// desk learns the state of every ticket from the `ticket_state` messages it
// is sent on connecting, so a change missed while disconnected is recovered
// from them.

// The exchange accepted a ticket message and logged it. For a `ticket` it
// carries the ticket's identity and the figures the exchange stamped at
// acceptance; the ticket's state then follows in TicketState. For a
// `ticket_cancel` or `ticket_urgency` only the first four fields are set, and
// the changed state follows in TicketState.
message TicketAccepted {
  string request_ref = 1; // id. Echoes the inbound message
  TicketRequestKind request_kind = 2; // SPEC 23.2
  string ticket_id = 3;   // id, decimal digits. The ticket the message submitted, cancelled or changed
  int64 receipt_time = 4; // timestamp. Gateway receipt
  // Present iff request_kind is TICKET_REQUEST_SUBMIT: the decision price P0,
  // the official one-second mark at or immediately preceding acceptance
  // (SPEC 7.1, SPEC 23.2).
  optional int64 decision_price = 5; // int64-micro
  // Present iff request_kind is TICKET_REQUEST_SUBMIT: the acceptance time.
  optional int64 accepted_time = 6; // timestamp. SPEC 23.2
  // Present iff request_kind is TICKET_REQUEST_SUBMIT: the first time the
  // schedule's due shares reach the ticket's quantity, which is not a
  // promise and not a deadline (SPEC 23.2, SPEC 23.3).
  optional int64 planned_completion_time = 7; // timestamp
  // Present iff request_kind is TICKET_REQUEST_SUBMIT: the algorithm the
  // ticket was accepted with, TWAP on a desk-routed or cure ticket (SPEC
  // 23.2).
  optional TicketAlgorithm algorithm = 8;
  // Present iff request_kind is TICKET_REQUEST_SUBMIT: who executes the
  // ticket, DESK or SERVICE, by the automatic execution routing in force at
  // acceptance (SPEC 23.4).
  optional TicketExecutor executor = 9;
}

// A ticket message was refused and nothing was logged. Its reason code is
// one of `TicketReasonCodes.TicketReasonCode`.
message TicketReject {
  // Required, except absent when the message could not be parsed far enough
  // to read one, or when the client sent an empty string.
  optional string request_ref = 1; // id
  TicketRequestKind request_kind = 2; // The kind of the message refused
  TicketReasonCodes.TicketReasonCode reason_code = 3; // SPEC 23.2
  optional string reason_detail = 4; // Free text, for example the projected limit that failed
  int64 receipt_time = 5; // timestamp. Gateway receipt
}

// The state of one ticket, sent to the originating pod and to the assigned
// desk whenever the ticket changes (acceptance, a fill, a change of urgency,
// a stop) and, for every ticket of the current term, when either connects
// (SPEC 23.2, Table 21; SPEC 24.1, SPEC 24.4). A pod is sent its own tickets
// only (SPEC 24.4). Reading a ticket is logged (SPEC 23.2). The connect-time
// set comes in ascending ticket_id order, once, right after the instruments
// message, and is not sent again after a resume.
message TicketState {
  string ticket_id = 1;   // id, decimal digits. Immutable; the exchange assigns it at acceptance
  // Present iff a pod originated the ticket: the pod's team. Absent on a
  // house ticket, which carries house_instruction_id instead. SPEC 23.2
  optional string pod = 2; // id
  string desk = 3;        // id. The assigned Execution desk. SPEC 23.2
  string instrument = 4;  // id. SPEC 23.2
  Side side = 5;          // SPEC 23.2
  int64 shares = 6;       // int64-qty. The ticket quantity Q. SPEC 23.2
  // Absent on a cure ticket: the hard execution limit. SPEC 23.2, SPEC 23.6
  optional int64 limit_price = 7; // int64-micro
  TicketUrgency urgency = 8; // Current urgency. SPEC 23.2
  int64 decision_price = 9;  // int64-micro. P0. SPEC 23.2
  int64 accepted_time = 10;  // timestamp. SPEC 23.2
  int64 planned_completion_time = 11; // timestamp. At acceptance. SPEC 23.2, SPEC 23.3
  // The shares due by update_time under the schedule, S(t), at most `shares`
  // (SPEC 23.3). A stopped ticket's value is as at its stop.
  int64 due_shares = 12;       // int64-qty
  int64 filled_shares = 13;    // int64-qty. Filled so far
  int64 remaining_shares = 14; // int64-qty. `shares` less `filled_shares`
  // Present iff filled_shares is above zero: the volume-weighted average
  // price of the fills. SPEC 24.4
  optional int64 average_fill_price = 15; // int64-micro
  // Fees net of rebates, signed as the fee of an execution is: negative for
  // net fees paid, positive for a net rebate. SPEC 12.1, SPEC 24.4
  int64 net_fee = 16; // int64-micro
  TicketStatus status = 17; // SPEC 23.2
  // Present iff status is not TICKET_WORKING: when the ticket stopped, and
  // the official mark at that time. SPEC 23.2
  optional int64 stopped_time = 18; // timestamp
  // 0 where the instrument had no valid mark this session.
  optional int64 stopped_mark = 19; // int64-micro
  // The thesis and its version the ticket was accepted under, when it named
  // one. SPEC 23.1
  optional string thesis_id = 20; // id
  optional int32 thesis_version = 21;
  // The ticket this one replaces, if any: the cancelled ticket a pod named,
  // or, for a cure ticket, the ordinary reducing ticket its acceptance
  // cancelled. SPEC 23.2, SPEC 23.6
  optional string replaces_ticket_id = 22; // id
  bool cure = 23; // True on a cure ticket. SPEC 23.6
  // The pod's notes to the desk, as submitted; sent to the desk and the pod
  // only. SPEC 23.2
  optional string notes = 24;
  // timestamp. The time of the change this message reports, or of the
  // connection for the state sent on connecting.
  int64 update_time = 25;
  // Who executes the remaining shares: DESK, the assigned Execution desk, or
  // SERVICE, the automatic execution service.
  TicketExecutor executor = 26;
  // 27 to 30 were handover_time, desk_filled_shares, desk_net_fee and
  // desk_average_fill_price, set only on a ticket the Directors had handed
  // over to engine execution, removed with the Directors' execution fallback.
  // Never reused.
  reserved 27 to 30;
  reserved "handover_time", "desk_filled_shares", "desk_net_fee", "desk_average_fill_price";
  // The algorithm the ticket was accepted with: TWAP on a desk-routed or cure
  // ticket (SPEC 23.2).
  TicketAlgorithm algorithm = 31;
  // What the automatic execution service is doing with the ticket. Set on a
  // SERVICE ticket only; TICKET_ACTIVITY_UNSPECIFIED on any other (SPEC
  // 23.4, SPEC 23.5).
  TicketActivity activity = 32;
  // SERVICE ticket only: the filled shares were more than one nominal slice
  // behind the schedule's due shares at the service's last assessment.
  bool behind_schedule = 33;
  // SERVICE ticket only, present once a trading suspension has shifted the
  // schedule: the revised completion estimate. planned_completion_time stays
  // the estimate at acceptance.
  optional int64 revised_completion_time = 34; // timestamp
  // SERVICE ticket only: the automatic execution configuration's version in
  // force at acceptance. 0 on any other ticket.
  uint32 config_version = 35;
  // SERVICE ticket only, present once the service has assessed it: the
  // service's last assessment of the ticket.
  optional int64 last_assessment_time = 36; // timestamp
  // The exact sum of quantity times price over the ticket's fills, fees
  // excluded: the notional filled_shares were bought or sold for, so the
  // exact average price is filled_notional / filled_shares. 0 before any
  // fill. Set on every ticket (SPEC 23.5, SPEC 24.4).
  int64 filled_notional = 37; // int64-micro
  // The ticket's scheduled-against-filled history, in strictly ascending
  // time, no two points at one time (SPEC 23.3, SPEC 23.5): a point at each
  // tick at or after accepted_time while the ticket works, the ticks being
  // every session's open and every 30 minutes after it inside the session,
  // and the session's close; and an end point at stopped_time when the
  // ticket stops. A close or end point on a tick is one point. Sent in full
  // on every ticket_state, the connect-time set included. Empty when the
  // exchange holds no history for the ticket.
  repeated TicketProgressPoint progress = 38;
  // Present iff a Director's cancel of the ticket was logged outside a
  // session and has not yet taken effect: the cancel's entry stamp. The
  // ticket stays TICKET_WORKING, to stop TICKET_CANCELLED_BY_DIRECTOR at the
  // next session open; absent once it has stopped (SPEC 23.4).
  optional int64 director_stop_pending_time = 39; // timestamp
  // Present iff cure is true: the session date (ISO 8601, as the calendar's
  // session_date) whose official close is the cure deadline of the breach the
  // cure answers. Before that close, if no cure works, the engine queues its
  // own cure at it; after it, nothing steps in again (SPEC 23.6, Table 22).
  optional string cure_deadline_date = 40;
  // Present iff a Director originated the ticket as a house ticket
  // (house_ticket): the house instruction it names in place of a thesis.
  // pod is then absent and executor is DESK. SPEC 24.1, SPEC 24.2
  optional string house_instruction_id = 41; // id
}

// One point of a ticket's progress: the shares due by the schedule and the
// shares filled, both cumulative from the ticket's start, at time. A tick's
// filled_shares counts every fill stamped at or before the tick; an end
// point's is the ticket's final filled_shares.
message TicketProgressPoint {
  int64 time = 1;          // timestamp. The tick, or stopped_time for the end point
  int64 due_shares = 2;    // int64-qty. due_shares's rule, as of time
  int64 filled_shares = 3; // int64-qty
}
