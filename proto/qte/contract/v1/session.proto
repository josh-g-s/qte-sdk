// Session and subscription messages.
//
// **Version:** 1.8
//
// Message types on the envelope `type` field: `auth`, `session_ack`,
// `calendar`, `instruments`, `session_reject`, `heartbeat`, `resume`,
// `resume_ack`, `order_snapshot`, `subscribe`, `unsubscribe`, `account_query`.
//
// Status: PROVISIONAL. The session layer is partly specified. Auth.token,
// Calendar, Instruments, Heartbeat, Resume, ResumeAck and OrderSnapshot are
// decided. The other messages are a working proposal, so clients have
// something to build against; their shape may change.
//
// Every `timestamp` field is a signed 64-bit count of milliseconds since the
// Unix epoch, UTC (SPEC 8.1, SPEC 9.2, SPEC 13.1), carried on the wire as a
// decimal string like every 64-bit field.
syntax = "proto3";

package qte.contract.v1;

import "qte/contract/v1/common.proto";

option go_package = "qte-platform/schemas/gen/go/qte/contract/v1;contractv1";

// Inbound. Presents the account's token credential, the contract's decided
// means of authentication. The exchange's web frontend asks for the token on
// its connect screen and keeps it in memory only, never persisted to
// storage. Everything else in the session layer (which roles of a team may
// send orders, request_ref and exec_id, subscription) is not yet specified.
message Auth {
  string token = 1; // string. The account's token.
}

// Outbound.
message SessionAck {
  string session_id = 1;      // id. Not yet specified
  string team = 2;             // id. The team the authenticated account trades for. SPEC 2.1, SPEC 2.5
  int64 server_time = 3;       // timestamp. Milliseconds since the Unix epoch, UTC. Its other rules are not yet specified
  string contract_version = 4; // string. Not yet specified
  // bool. True when this is an unscored recorded session: no metric, score or
  // leaderboard counts it. False in a scored session. Always present, false
  // included. The exchange records the same flag when the session opens, so
  // what a team is told and what is scored cannot differ. SPEC 4.2. The
  // field's name and number are provisional.
  bool unscored = 5;
}

// One trading session's date and hours (SPEC 13.1, 13.2), an entry of
// Calendar.sessions.
message CalendarSession {
  string session_date = 1; // string. The US session date, ISO 8601, America/New_York. SPEC 13.1
  int64 open_time = 2;     // timestamp. 09:30 America/New_York. SPEC 13.1
  // timestamp. 16:00 America/New_York, or 13:00 on an early-close day.
  // SPEC 13.1, SPEC 13.2
  int64 close_time = 3;
  // bool. True on the one day of the term whose close_time is not the
  // regular session close. SPEC 13.2
  bool early_close = 4;
}

// One named US holiday inside the term (SPEC 13.2), an entry of
// Calendar.holidays.
message Holiday {
  string date = 1; // string. ISO 8601, America/New_York. SPEC 13.2
  string name = 2; // string. SPEC 13.2
}

// Outbound. Sent on the connection immediately after every SessionAck, at
// any hour, whether inside a session or not: teams are notified of the
// exchange calendar in advance (SPEC 13.1). Read from the term configuration
// the exchange runs; a client never hard-codes the NYSE calendar.
message Calendar {
  string term_first_session = 1; // string. The term's own first session date, ISO 8601. SPEC 13.2
  string term_last_session = 2;  // string. The term's own last session date, ISO 8601. SPEC 13.2
  // Every session of the term, in date order. SPEC 13.1, SPEC 13.2
  repeated CalendarSession sessions = 3;
  // Every named holiday whose date falls between term_start and term_end
  // inclusive, in date order. SPEC 13.2
  repeated Holiday holidays = 4;
  // timestamp, optional. The open_time of the first session whose open is
  // after the server's clock. Absent once the term's last session has
  // opened. SPEC 13.1, SPEC 13.2
  optional int64 next_open = 5;
  // string. The term's own configured start date, ISO 8601, from the term
  // configuration the exchange runs. Can precede term_first_session when
  // the range's first day is not a trading day. SPEC 13.2
  string term_start = 6;
  // string. The term's own configured end date, ISO 8601, from the term
  // configuration the exchange runs. Can follow term_last_session when the
  // range's last day is not a trading day, as for the Summer term, whose
  // configured range ends 18 June 2027, Juneteenth observed, the day after
  // its last actual session on 17 June 2027. SPEC 13.2
  string term_end = 7;
}

// What kind of instrument an InstrumentInfo describes. This enum is open to
// extension: a new value is an additive change, and a client that meets one it
// does not know treats the entry as an instrument of unknown kind.
enum InstrumentKind {
  INSTRUMENT_KIND_UNSPECIFIED = 0; // proto3's required zero value; never valid on the wire.
  EQUITY = 1; // A listed US equity or ETF, ordered in whole shares. SPEC 3.1
  OPTION = 2; // A listed option contract, ordered in whole contracts. SPEC 18.1
}

// The instrument's own condition, the same for every team. It says nothing of
// whether this team may trade it: that is InstrumentInfo.tradable. This enum
// is open to extension: a new value is an additive change.
enum InstrumentStatus {
  INSTRUMENT_STATUS_UNSPECIFIED = 0; // proto3's required zero value; never valid on the wire.
  // The instrument accepts orders (from a team entitled to send them).
  INSTRUMENT_TRADING = 1;
  // The platform has flagged the instrument and disabled it until the
  // Directors review it: it accepts no orders from any team and shows no wall.
  // SPEC 3.3
  INSTRUMENT_DISABLED = 2;
  // A listed option contract outside the day's active window that students
  // still hold: it accepts only orders that reduce a position and never cross
  // zero. SPEC 18.1
  INSTRUMENT_REDUCING_ONLY = 3;
}

// Whether an option contract is a call or a put. SPEC 18.1
enum OptionRight {
  OPTION_RIGHT_UNSPECIFIED = 0; // proto3's required zero value; never valid on the wire.
  CALL = 1;
  PUT = 2;
}

// The terms of one option contract (SPEC 18.1), carried by an InstrumentInfo
// whose kind is OPTION. Together they are what the contract's id spells.
message OptionTerms {
  string underlying = 1;  // id. The underlying equity's id, for example SPY or GOOGL. SPEC 18.1
  string expiry = 2;      // string. The listed expiry date, ISO 8601, a third Friday. SPEC 18.1
  OptionRight right = 3;  // SPEC 18.1
  int64 strike = 4;       // int64-micro. The strike price in micro-dollars. SPEC 18.1
  int64 multiplier = 5;   // int64-qty. Shares of the underlying per contract: 100. SPEC 18.1
}

// One instrument of the exchange as the authenticated team sees it, an entry
// of Instruments.instruments.
message InstrumentInfo {
  // id. The instrument's id, the string every other message and every order
  // names it by. An equity is its ticker; an option contract is its OCC option
  // symbol in the form Alpaca uses, the root unpadded, then YYMMDD, then C or P,
  // then the strike times 1000 in eight digits, for example SPY240119C00470000.
  // SPEC 3.1, SPEC 18.1
  string instrument = 1;
  // string, optional. A human-readable name. Absent when the exchange has none
  // to give; a client never parses it and falls back to `instrument`.
  optional string display_name = 2;
  InstrumentKind kind = 3;
  // int64-micro. The smallest price step: every order price is a multiple of it.
  // An equity's tick is $0.01 (10,000 micro-dollars); an option's is its premium
  // tick. SPEC 3.3, SPEC 18.1
  int64 tick_size = 4;
  // int64-qty. The smallest order size and the step orders are sized in: one
  // share for an equity, one contract for an option. SPEC 8.2, SPEC 18.1
  int64 lot_size = 5;
  InstrumentStatus status = 6;
  // bool. True when the authenticated team may send orders in this instrument
  // at all; false when its arm or its assignment rules it out, for example a
  // Market Making desk's instrument outside its assigned names, an instrument
  // of a kind its arm may not trade, or any instrument for an account with no
  // market access. Always present, false included. It reflects what the team's
  // entitlement allows and nothing else: whether the instrument itself is
  // disabled is `status`, and a limit or a halt the team is under is not part
  // of it. SPEC 2.2, SPEC 9.4.3
  bool tradable = 7;
  // Present if and only if `kind` is OPTION.
  optional OptionTerms option = 8;
}

// One underlying of the option chain, an entry of
// Instruments.option_underlyings: its strike increment and the ids of the
// option contracts listed on it, so a client never guesses a listed symbol.
message OptionUnderlying {
  string underlying = 1;        // id. The underlying equity's id, for example SPY or GOOGL. SPEC 18.1
  int64 strike_increment = 2;   // int64-micro. The published strike increment in micro-dollars: $5.00 for SPY, $2.50 for GOOGL. SPEC 18.1
  // array of id. The ids of every option contract listed on this underlying,
  // sorted ascending by byte order: each is also an InstrumentInfo of kind
  // OPTION in Instruments.instruments. Empty while no contract is listed.
  repeated string contracts = 3;
}

// Outbound. The instruments of the exchange, and which of them the
// authenticated team may trade. Sent on the connection immediately after the
// Calendar that follows every SessionAck, at any hour, whether inside a
// session or not. The three messages arrive back to back.
//
// It lists every instrument the exchange runs, sorted ascending by the byte
// order of `instrument`, one entry each. A client builds its instrument table
// from it and never hard-codes the universe or an option's symbol. It is the
// whole table, not a change to one: whenever the exchange resends it on a
// connection, because an instrument was listed, delisted or changed status,
// the new message replaces the client's table entirely.
//
// `option_underlyings` names each option underlying, sorted by byte order of
// its id, with its strike increment and its listed contracts. It is always
// sent, to every team, with each underlying present even when it has no
// listed contract yet.
message Instruments {
  repeated InstrumentInfo instruments = 1;
  repeated OptionUnderlying option_underlyings = 2;
}

// Outbound.
message SessionReject {
  // Band 1000 of ReasonCodes.ReasonCode, for example NOT_AUTHENTICATED or
  // VERSION_MISMATCH. Not yet specified.
  ReasonCodes.ReasonCode reason_code = 1;
  optional string reason_detail = 2; // string. Not yet specified
}

// Outbound. Envelope only: no payload fields. The server sends one every 15
// seconds, from the moment the connection opens, at any hour. A client that
// has received no message of any kind for 45 seconds treats the link as dead
// and reconnects.
message Heartbeat {
}

// Inbound. Optional. Sent once on a connection, after `auth`, to ask for the
// private order reports the team has not yet seen. The server answers with
// ResumeAck.
//
// The client rule. Live reports can arrive from connection open, before this
// is sent, so:
//   1. Buffer every private report from connection open.
//   2. On ResumeAck, drop the buffered reports whose report_seq is at or
//      below as_of_report_seq and keep those above.
//   3. Process the replay in report_seq order.
//   4. Keep buffering reports above as_of_report_seq until the replay or the
//      snapshot completes. A replay completes on processing the report whose
//      report_seq equals as_of_report_seq (at once if the cursor already
//      equals it); a snapshot completes when all snapshot_count
//      OrderSnapshot messages have arrived.
//   5. Then apply the kept reports in report_seq order, skipping any whose
//      report_seq is not above the cursor.
// A client that does not resume applies the buffered reports on session_ack.
message Resume {
  reserved 1, 2;
  reserved "session_id", "last_seq_received";
  // integer. The client's cursor: the highest contiguous report_seq (see the
  // envelope) it has processed with no gap in this term, or 0 if none. A
  // completed snapshot sets it to exactly as_of_report_seq, not "if higher",
  // so it can fall at a term change: report_seq restarts each term, so a
  // stored cursor is meaningful only within its term, and the snapshot path
  // resets it. Example: cursor 1000, new term with head 3, snapshot, cursor
  // becomes 3, and the kept reports 4 and up apply. It is not the highest
  // seen, and not a report that is buffered but not yet applied. A 64-bit
  // value, so on the wire it is a decimal string. Must not be negative.
  int64 last_report_seq = 3;
}

// Outbound. The answer to Resume. On it the client drops the reports it
// buffered from connection open whose report_seq is at or below
// as_of_report_seq and keeps those above (the full client rule is on Resume).
// When `replayed` is true, the reports the client missed follow, in
// report_seq order, each identical to the original; live reports above
// as_of_report_seq may arrive before the replay finishes, and the client keeps
// them buffered until it does, then applies them in order. When `replayed` is
// false, nothing is replayed: `snapshot_count` OrderSnapshot messages follow,
// the client's cursor becomes `as_of_report_seq`, and the reports above it,
// live or buffered, apply in order.
message ResumeAck {
  // bool. True if every report after the client's last_report_seq is being
  // replayed; false if a snapshot of the team's resting orders is sent
  // instead.
  bool replayed = 1;
  // integer. The report_seq of the newest report that the replay or the
  // snapshot covers. Live reports that follow have a greater report_seq. A
  // 64-bit value, so on the wire it is a decimal string.
  int64 as_of_report_seq = 2;
  // integer. The number of OrderSnapshot messages that follow. Always 0 when
  // `replayed` is true. 0 when `replayed` is false means the team has no
  // resting order.
  int32 snapshot_count = 3;
}

// Outbound. One per resting order of the team, sent only after a ResumeAck
// whose `replayed` is false. A team has at most one resting order at each
// instrument, side and price. They arrive sorted by instrument (ascending
// byte order of the instrument symbol), then side (BUY before SELL), then
// price (ascending). The order is identified by that instrument, side and
// price: there is no order id.
message OrderSnapshot {
  reserved 5, 7;
  reserved "state", "stale_since";
  string strat_id = 1;   // id. The strategy that holds the order. SPEC 2.5
  string instrument = 2; // id. SPEC 8.2
  Side side = 3;          // SPEC 8.2
  int64 price = 4;        // int64-micro. SPEC 8.2
  int64 remaining_size = 6;      // int64-qty. SPEC 8.2
  int64 timestamp = 8; // timestamp. SPEC 9.2
}

// Inbound. One market-data feed, the same for every team (SPEC 4.3): no
// channel selector and no per-team cadence.
message Subscribe {
  repeated string instruments = 1; // array of id. Not yet specified
}

// Inbound.
message Unsubscribe {
  repeated string instruments = 1; // array of id. Not yet specified
}

// Inbound. A team asks for its own account: its positions, cash, equity and
// limit use, at any hour, inside a session or not (SPEC 13.1, SPEC 13.4). It
// carries no team: the account is always the team the connection
// authenticated as (`SessionAck.team`), so a team can never ask for another's.
// It is not an order message. It has no order delay, no receipt or release
// stage and no place in the new, cancel and amend message budgets (SPEC 8.1,
// SPEC 8.3, SPEC 9.4.3), and a Fundamentals pod, whose account has no market
// access but holds positions (SPEC 2.2), may send it. The reply is one
// `account_state` (`order_events.proto`) echoing `request_ref`. An
// unauthenticated query (NOT_AUTHENTICATED), a malformed one (MALFORMED_MESSAGE,
// including an empty or missing request_ref, which counts as absent as it does
// for the order messages), or one from a team the Directors' kill switch has
// stopped (TEAM_DISABLED, SPEC 8.2), gets a `reject` echoing `request_ref` as
// sent, with request_type ACCOUNT_QUERY. The 32-byte identifier limit of
// `order_entry.proto` applies to this message's request_ref: one over 32 bytes
// is a malformed message.
message AccountQuery {
  string request_ref = 1; // id, 1 to 32 bytes. Required, echoed on the reply and on any reject
}
