// Common types shared across the wire contract: the enums the message files
// in this package use.
//
// **Version:** 1.15
//
// A field is never renumbered, and a retired field's number is never reused.
syntax = "proto3";

package qte.contract.v1;

option go_package = "qte-platform/schemas/gen/go/qte/contract/v1;contractv1";

// BUY or SELL (SPEC 8.2). Shared by every `side` and `aggressor_side` field so
// the token set cannot drift between messages.
enum Side {
  SIDE_UNSPECIFIED = 0; // proto3's required zero value; never valid on the wire.
  BUY = 1;
  SELL = 2;
}

// LIMIT or MARKET (SPEC 6.3, SPEC 8.1). `new`'s `order_type` field.
enum OrderType {
  ORDER_TYPE_UNSPECIFIED = 0;
  LIMIT = 1;
  MARKET = 2;
}

// The inbound message kind an `accepted` or `reject` responds to (SPEC 8.2).
// `reject.request_type` additionally allows SUBSCRIBE, UNSUBSCRIBE, RESUME and
// ACCOUNT_QUERY (see `Reject` in `order_events.proto`); `accepted.request_type`
// only ever carries the first four values, a subset of this same enum.
enum RequestType {
  REQUEST_TYPE_UNSPECIFIED = 0;
  NEW = 1;
  CANCEL = 2;
  AMEND = 3;
  MASS_CANCEL = 4;
  SUBSCRIBE = 5;
  UNSUBSCRIBE = 6;
  RESUME = 7;
  ACCOUNT_QUERY = 8;
}

// The origin of a fill or a cancellation (SPEC 11.1, SPEC 11.2, SPEC 14).
enum Origin {
  ORIGIN_UNSPECIFIED = 0;
  TEAM = 1;
  CURE_TRADE = 2;
  AUTO_FLATTEN = 3;
  // A house order (SPEC 14). A report whose origin is HOUSE is delivered to
  // Director sessions only, never to a team's connection.
  HOUSE = 4;
}

// MAKER or TAKER (SPEC 12.1, SPEC 16.4). `execution.liquidity`.
enum Liquidity {
  LIQUIDITY_UNSPECIFIED = 0;
  MAKER = 1;
  TAKER = 2;
}

// The match classification, shared by `execution.fill_kind` and
// `TapePrint.kind`, so a fill and its tape print use the same tokens.
// `execution.fill_kind` never carries RESIDUAL: residual prints are tape
// bookkeeping, never a fill of any team's order (SPEC 10).
enum MatchKind {
  MATCH_KIND_UNSPECIFIED = 0;
  STUDENT_TO_STUDENT = 1;
  STUDENT_TO_WALL = 2;
  TRADE_BASED_MATCH = 3;
  RESIDUAL = 4;
}

// The order lifecycle state (SPEC 8.4, SPEC 8.5). `order_state.state`.
enum OrderLifecycleState {
  ORDER_LIFECYCLE_STATE_UNSPECIFIED = 0;
  RESTING = 1;
  STALE = 2;
  FILLED = 3;
  CANCELLED = 4;
  PURGED = 5;
}

// OPEN or CLOSED (SPEC 8.1, SPEC 13.1). `session_state.state`. Named
// `MarketSessionPhase`, not `SessionState`, so it does not collide with the
// `SessionState` message it is a field of (`market_data.proto`).
enum MarketSessionPhase {
  MARKET_SESSION_PHASE_UNSPECIFIED = 0;
  OPEN = 1;
  CLOSED = 2;
}

// The prices a team's positions and equity are valued at in an
// `account_state` reply (SPEC 7.1, SPEC 13.4). LIVE_MARK: inside a session,
// at each instrument's official mark as it stands (SPEC 7.1, SPEC 7.2); an
// instrument with no valid mark yet in the session is valued at its last
// official close.
// LAST_OFFICIAL_CLOSE: outside a session, at each instrument's latest official
// close, a break day's close included. `account_state.session_date` is the
// trading date of that close.
//
// This enum is closed: adding a value later is a breaking change.
enum ValuationBasis {
  VALUATION_BASIS_UNSPECIFIED = 0; // proto3's required zero value; never valid on the wire.
  LIVE_MARK = 1;
  LAST_OFFICIAL_CLOSE = 2;
}

// Where a team stands against its arm's daily loss limits
// (`account_summary.loss_level`, SPEC 11.1, Table 3). NONE: the daily loss is
// below 60% of the halt level, or the arm has no daily loss limit. WARNING:
// the daily loss has reached 60% of the halt level; a notification only.
// HALT: the daily loss has reached the halt level and the team is restricted
// to position-reducing orders until the session end (for the Agentic AI arm
// the level is its 4.0% single-session auto-flatten threshold).
//
// This enum is open to extension: adding a value later is an additive change,
// not a breaking one.
enum LossLevel {
  LOSS_LEVEL_UNSPECIFIED = 0;
  LOSS_LEVEL_NONE = 1;
  LOSS_LEVEL_WARNING = 2;
  LOSS_LEVEL_HALT = 3;
}

// The kind of one Table 3 limit (`LimitUtilisation.kind`, SPEC 11.1). Each
// value fixes what its `used` and `cap` measure; every one is an amount in
// micro-dollars (a vega limit is micro-dollars per volatility point). Only the
// limits that bound a held position appear: the per-order caps, the message
// limits and the Fundamentals drawdown review are not utilisations.
//
// This enum is open to extension: adding a value later is an additive change,
// not a breaking one.
enum LimitKind {
  LIMIT_KIND_UNSPECIFIED = 0;
  LIMIT_GROSS = 1;         // Gross notional, whole book. SPEC 11.1
  LIMIT_NET = 2;           // Market Making net exposure, whole book. SPEC 11.1
  LIMIT_INSTRUMENT = 3;    // One instrument's position notional; Fundamentals' entry cap, projected exposure. SPEC 11.1, SPEC 23.3
  LIMIT_INSTRUMENT_HARD = 4; // Fundamentals' hard per-instrument cap. SPEC 11.1
  LIMIT_SECTOR = 5;        // One GICS sector's notional (Fundamentals). SPEC 11.1
  LIMIT_SHORT_OF_GROSS = 6; // Short notional against its share of gross (Fundamentals). SPEC 11.1
  LIMIT_VEGA = 7;          // Vega against the sqrt(T) schedule (Options). SPEC 11.1, SPEC 18.7
  LIMIT_GAMMA_DOLLAR = 8;  // Whole book: sum over underlyings of abs(gamma dollars) (Options). SPEC 11.1, SPEC 18.7
  LIMIT_NET_DELTA_UNDERLYING = 9; // Absolute net delta of one underlying (Options). SPEC 11.1
  LIMIT_NET_DELTA_BOOK = 10;      // Absolute net delta, whole book (Options). SPEC 11.1
  LIMIT_HEDGING_ALLOWANCE_UNDERLYING = 11; // Hedge-stock allowance of one underlying (Options). SPEC 11.1, SPEC 18.8
  LIMIT_HEDGING_ALLOWANCE_BOOK = 12;       // Hedge-stock allowance, whole book (Options). SPEC 11.1, SPEC 18.8
  // One underlying with two live expiries: abs(summed signed vega) against the longest live tenor's cap (Options). SPEC 18.7
  LIMIT_VEGA_UNDERLYING_AGGREGATE = 13;
  // The three SPEC 18.8 hedge-qualification tests, which are not Table 3 limits
  // but start a cure window all the same (SPEC 18.8 "Hedge orders and unwinds").
  // Wrong-sign hedge stock of one underlying: used is the wrong-sign stock
  // notional |H_i|, cap is 0. SPEC 18.8
  LIMIT_HEDGE_SIGN = 14;
  // One underlying's hedge stock magnitude: used is |H_i|, cap is |D_i| plus
  // tau_hedge ($100k). SPEC 18.8
  LIMIT_HEDGE_MAGNITUDE_UNDERLYING = 15;
  // The book's hedge stock magnitude: used is sum_i |H_i|, cap is sum_i |D_i|
  // plus $150k. SPEC 18.8
  LIMIT_HEDGE_MAGNITUDE_BOOK = 16;
}

// `risk_notice.kind` (SPEC 11.1). A loss halt, a cure window and its deadline,
// a cure trade, the auto-flatten and the Directors' kill switch are notified
// on this connection alongside the loss warning, when the engine records them
// (SPEC 11.1, SPEC 15.4).
//
// This enum is open to extension: adding values later is an additive change,
// not a breaking one.
enum RiskNoticeKind {
  RISK_NOTICE_KIND_UNSPECIFIED = 0;
  // The daily loss reached 60% of the halt level; a notification only.
  LOSS_WARNING = 1; // SPEC 11.1
  // The daily loss reached the halt level and the desk entered its loss halt
  // (SPEC 11.1, SPEC 11.2, SPEC 16.5, SPEC 17.4).
  LOSS_HALT_ENTERED = 2;
  // A cure window opened. The notice carries its deadline and the breached
  // limits (SPEC 11.2).
  CURE_WINDOW_OPENED = 3;
  // The engine placed a cure trade from the team's account (SPEC 11.2).
  CURE_TRADE_PLACED = 4;
  // The Agentic AI single-session auto-flatten began (SPEC 11.1, SPEC 11.2).
  AUTO_FLATTEN_STARTED = 5;
  // The Directors' kill switch stopped the team (SPEC 8.2, SPEC 11.1).
  KILL_SWITCH_ENGAGED = 6;
  // 7-15 reserved for growth.
}

// A Fundamentals ticket's urgency, chosen by the pod (SPEC 23.2). It sets the
// share of the instrument's average daily volume the ticket's schedule plans
// to trade in each session: 1/3 High, 1/5 Medium, 1/10 Low (SPEC 23.2). The
// values carry the `URGENCY_` prefix because proto enum values share the
// package's scope.
//
// This enum is closed: adding a value later is a breaking change.
enum TicketUrgency {
  TICKET_URGENCY_UNSPECIFIED = 0;
  URGENCY_HIGH = 1;
  URGENCY_MEDIUM = 2;
  URGENCY_LOW = 3;
}

// A Fundamentals ticket's status (SPEC 23.2, Table 21): Working, then one of
// the stopped statuses. A stopped ticket never works again.
//
// This enum is open to extension: adding a value later is an additive change,
// not a breaking one.
enum TicketStatus {
  TICKET_STATUS_UNSPECIFIED = 0;
  // Accepted and not yet stopped.
  TICKET_WORKING = 1;
  // The whole quantity is filled (SPEC 23.2).
  TICKET_COMPLETE = 2;
  // Shares unfilled at the close of the term's final session (SPEC 23.2).
  TICKET_EXPIRED = 3;
  // The engine cancelled the remainder because the official one-second mark
  // moved beyond the limit (SPEC 23.2).
  TICKET_LIMIT_CANCELLED = 4;
  // The pod cancelled it (SPEC 23.2).
  TICKET_CANCELLED_BY_POD = 5;
  // The engine cancelled it for another reason: a position breach cancelling
  // an increasing ticket, or a cure ticket replacing a reducing one
  // (SPEC 23.3).
  TICKET_CANCELLED_BY_ENGINE = 6;
  // 7-15 reserved for growth.
}

// Which inbound ticket message a `ticket_accepted` or `ticket_reject`
// answers.
//
// This enum is closed: adding a value later is a breaking change.
enum TicketRequestKind {
  TICKET_REQUEST_KIND_UNSPECIFIED = 0;
  // A `ticket`.
  TICKET_REQUEST_SUBMIT = 1;
  // A `ticket_cancel`.
  TICKET_REQUEST_CANCEL = 2;
  // A `ticket_urgency`.
  TICKET_REQUEST_URGENCY = 3;
}

// The reason codes a `ticket_reject` carries. A separate enum from
// `ReasonCodes.ReasonCode`, so that the order-entry reasons stay exactly the
// set the exchange's event log defines. Every value that also exists in
// `ReasonCodes.ReasonCode` has the same name and the same number there; the
// values from 1700 are specific to tickets. Like `ReasonCodes.ReasonCode`,
// this enum is open to extension: adding a value later is an additive change.
//
// Nesting inside a message gives the enum its own scope, as `ReasonCodes` does.
message TicketReasonCodes {
  enum TicketReasonCode {
    TICKET_REASON_CODE_UNSPECIFIED = 0;

    // Shared with ReasonCodes.ReasonCode, same numbers.
    NOT_AUTHENTICATED = 1000;
    VERSION_MISMATCH = 1001;
    TEAM_DISABLED = 1003;
    MARKET_CLOSED = 1004;
    INSTRUMENT_DISABLED = 1104;
    MALFORMED_MESSAGE = 1200;
    UNKNOWN_INSTRUMENT = 1201;
    TICK_VIOLATION = 1202;
    INVALID_SIZE = 1203;
    NON_POSITIVE_PRICE = 1204;
    SIZE_OUT_OF_RANGE = 1206;
    REFERENCE_UNAVAILABLE = 1301;
    RISK_LIMIT_BREACH = 1600;

    // 1700: Ticket intake.
    // An opening or increasing ticket that names no filed thesis covering
    // its instrument and side, or a thesis version that does not exist
    // (SPEC 23.1).
    TICKET_THESIS_NOT_FILED = 1700;
    // The pod already has a working ticket in the instrument; there is one
    // working ticket per instrument (SPEC 23.2).
    TICKET_INSTRUMENT_WORKING = 1701;
    // A reducing ticket larger than the position, or a ticket that would
    // cross zero (SPEC 23.2).
    TICKET_CROSSES_ZERO = 1702;
    // The limit is not at or beyond the unshifted wall price the ticket
    // would trade against, so it would cancel on arrival (SPEC 23.2).
    TICKET_LIMIT_INSIDE_WALL = 1703;
    // The planned completion falls after the close of the term's final
    // session, for a ticket that increases a position (SPEC 23.2).
    TICKET_COMPLETES_AFTER_TERM = 1704;
    // The instrument's mark is frozen, and no ticket is accepted in it
    // (SPEC 23.2, SPEC 7.2).
    TICKET_MARK_FROZEN = 1705;
    // replaces_ticket_id names no cancelled ticket of this pod in this
    // instrument (SPEC 23.2).
    TICKET_REPLACES_INVALID = 1706;
    // No ticket with that id belongs to this pod.
    TICKET_NOT_FOUND = 1707;
    // The ticket is already stopped.
    TICKET_NOT_WORKING = 1708;
    // A cure ticket cannot be cancelled by the pod (SPEC 23.3).
    TICKET_CURE_NOT_CANCELLABLE = 1709;
    // An urgency change on a ticket that is not a cure ticket (SPEC 23.2,
    // SPEC 23.3).
    TICKET_NOT_CURE = 1710;
    // A cure ticket's urgency may only increase (SPEC 23.3).
    TICKET_URGENCY_NOT_INCREASED = 1711;
    // A cure ticket in an instrument with no position breach, one that does
    // not reduce the position, or one smaller than the whole shares needed
    // to reach the entry cap (SPEC 23.3).
    TICKET_CURE_INVALID = 1712;
    // 1713-1799 reserved for band 1700 growth.
  }
}

// Namespacing wrapper. `ReasonCode`'s values would otherwise collide with
// `RequestType.MASS_CANCEL` and other tokens in this package: proto enum
// values share their enclosing package's scope, not just their own enum's.
// Nesting inside a message gives the enum its own scope without renaming a
// reason code.
message ReasonCodes {
  // The reason codes. One flat enum: every `reject` and every
  // `order_cancelled` carries exactly one value from it. The band (the
  // grouping by kind of check) is never a wire field; it is carried only in
  // the value's number, which is why the numbers below are not sequential
  // from 1.
  enum ReasonCode {
    REASON_CODE_UNSPECIFIED = 0;

    // 1000: Session and access. NOT_AUTHENTICATED and VERSION_MISMATCH
    // belong to the session layer, which is not yet specified.
    NOT_AUTHENTICATED = 1000;
    VERSION_MISMATCH = 1001;
    NO_MARKET_ACCESS = 1002;
    TEAM_DISABLED = 1003;
    MARKET_CLOSED = 1004;
    RELEASE_AFTER_CLOSE = 1005;
    // A `new` or `amend` rejected at release because a Director-declared
    // exchange outage is in force, checked at release step 1 with the kill
    // switch (SPEC 4.3, SPEC 9.4.3). A `cancel` or `mass_cancel` still
    // applies.
    EXCHANGE_OUTAGE = 1006;
    // A Market Making, Market Taking, Options MM or Options Taking order
    // message received at or after the term-end trading cutoff, five minutes
    // before the actual close of the term's final session (SPEC 13.5,
    // SPEC 9.4.3). A new or amend of the team's still waiting out its delay at
    // the cutoff is dropped with no answer, not rejected with this code: the
    // Technology Arm's reading of SPEC 13.5, which does not say "without a
    // response" (see TERM_CUTOFF).
    TRADING_CUTOFF = 1007;
    // 1008-1099 reserved for band 1000 growth.

    // 1100: Registration and entitlement
    STRATEGY_NOT_REGISTERED = 1100;
    OUTSIDE_DECLARED_SCOPE = 1101;
    INSTRUMENT_NOT_PERMITTED = 1102;
    INSTRUMENT_SUSPENDED = 1103;
    // A `new` or `amend` in an instrument disabled for the term because its
    // frozen statistics are degenerate (SPEC 3.3, SPEC 9.4.3). A `cancel`
    // there is never rejected on this ground.
    INSTRUMENT_DISABLED = 1104;
    // A `new` or `amend` in an option contract that is not listed this
    // session: in neither the active window nor retained (SPEC 18.1).
    CONTRACT_NOT_LISTED = 1105;
    // 1106-1199 reserved for band 1100 growth.

    // 1200: Message validity. MALFORMED_MESSAGE, UNKNOWN_INSTRUMENT,
    // TICK_VIOLATION, INVALID_SIZE and NO_ORDER_AT_LEVEL are validation
    // rejects SPEC.md does not list by name; their exact scope is not yet
    // specified.
    MALFORMED_MESSAGE = 1200;
    UNKNOWN_INSTRUMENT = 1201;
    TICK_VIOLATION = 1202;
    INVALID_SIZE = 1203;
    NON_POSITIVE_PRICE = 1204;
    NO_ORDER_AT_LEVEL = 1205;
    SIZE_OUT_OF_RANGE = 1206;
    // 1207-1299 reserved for band 1200 growth.

    // 1300: Price
    PRICE_COLLAR = 1300;
    REFERENCE_UNAVAILABLE = 1301;
    NO_WALL_ON_SIDE = 1302;
    AMEND_PRICE_AT_OR_BEYOND_WALL = 1303;
    // A `new` or `amend` released while its option contract is suspended
    // (SPEC 18.2); a `cancel` still applies.
    CONTRACT_SUSPENDED = 1304;
    // 1305-1399 reserved for band 1300 growth.

    // 1400: Order handling
    MIN_REST_VIOLATION = 1400;
    DUPLICATE_ORDER_AT_LEVEL = 1401;
    AMEND_WOULD_MAKE_STALE_MARKETABLE = 1402;
    // 1403-1499 reserved for band 1400 growth.

    // 1500: Message budgets
    MESSAGE_BUDGET_EXCEEDED = 1500;
    BURST_CAP_EXCEEDED = 1501;
    NEW_ORDER_CAP_EXCEEDED = 1502;
    // 1503-1599 reserved for band 1500 growth.

    // 1600: Risk. SANITY_GATE_REJECTED's median window and start-up are not
    // yet specified.
    RISK_LIMIT_BREACH = 1600;
    PARTICIPATION_CAP_EXCEEDED = 1601;
    POSITION_REDUCING_ONLY = 1602;
    RISK_REDUCING_ONLY = 1603;
    SANITY_GATE_REJECTED = 1604;
    HEDGE_ONLY = 1605;
    PARENT_NOT_WORKING = 1606;
    PARENT_MISMATCH = 1607;
    PARENT_QUANTITY_EXCEEDED = 1608;
    // A `new` or `amend` in a reducing-only option contract that would
    // increase the desk's absolute position in it or cross zero (SPEC 18.1,
    // SPEC 18.3, SPEC 18.6).
    CONTRACT_REDUCING_ONLY = 1609;
    // 1610-1699 reserved for band 1600 growth. Band 1700 is the ticket
    // reasons of `TicketReasonCodes.TicketReasonCode` and is not used here.
    // 1700-1799 stay unused in this enum.

    // 1800: Cancellation. Carried on `order_cancelled`, never on `reject`,
    // except CURE_WINDOW below.
    CANCEL_REQUEST = 1800;
    MASS_CANCEL = 1801;
    SELF_TRADE = 1802;
    PURGE_STALE = 1803;
    SESSION_CLOSE = 1804;
    MARKET_REMAINDER = 1805;
    REMAINDER_OUTSIDE_BAND = 1806;
    // On `order_cancelled`: an outstanding order in a breached limit's scope,
    // cancelled when a cure window opens. Also carried on a `reject`: a new
    // in that scope still pending when the window opened or the scope was
    // added, rejected at its release so that it never becomes active
    // (SPEC 11.2).
    CURE_WINDOW = 1807;
    STRATEGY_NOT_LIVE = 1808;
    KILL_SWITCH = 1809;
    // A resting order the team's amend cut to nothing, which leaves the book
    // (SPEC 8.2).
    AMEND_CUT = 1810;
    HEDGE_RECHECK_FAILED = 1811;
    // An Execution desk's order cancelled because the participation cap
    // bound: what its permitted fills leave of it (SPEC 24.3).
    PARTICIPATION_LIMIT = 1812;
    // An outstanding order cancelled at loss-halt entry: the halt is
    // desk-wide (SPEC 11.2, SPEC 16.5, SPEC 17.4).
    LOSS_HALT = 1813;
    // Under a loss halt, a resting order's quantity cancelled before a fill
    // because it would increase the position or cross zero (SPEC 16.5,
    // SPEC 17.4).
    POSITION_REDUCING_RECHECK_FAILED = 1814;
    // A Market Making, Market Taking, Options MM or Options Taking order
    // cancelled at the term-end trading cutoff, five minutes before the
    // actual close of the term's final session (SPEC 13.5). A new or amend
    // of the team's still waiting out its delay at the cutoff is not
    // cancelled with this code but dropped with no answer, the way the close
    // drops one. That "no answer" is the Technology Arm's reading of SPEC
    // 13.5, which cancels pending submissions and amendments but does not say
    // "without a response".
    TERM_CUTOFF = 1815;
    // A resting order in a reducing-only option contract cancelled because it
    // would increase the desk's absolute position or cross zero: whole when
    // the contract turns reducing-only, or the quantity that would, before a
    // fill (SPEC 18.1, SPEC 18.3, SPEC 18.6).
    CONTRACT_REDUCING_RECHECK_FAILED = 1816;
    // An Execution desk's child cancelled because its parent ticket stopped
    // by any path other than filling: the pod cancelled it, or the official
    // mark moved beyond its limit (SPEC 24.1, SPEC 23.2). A term's final close
    // expiring the ticket cancels none further, since the close has cancelled
    // the day's children SESSION_CLOSE. The engine's own cancellation of a
    // ticket (a breach cancelling an increasing ticket, a cure ticket
    // replacing a reducing one) cancels no child by any code in the engine as
    // built, since none rests then; the Directors' fallback handover (SPEC
    // 23.2), which cancels all outstanding children, uses this code too,
    // though the parent does not stop: the engine goes on executing its
    // remaining shares.
    PARENT_STOPPED = 1817;
    // 1818-1899 reserved for band 1800 growth.
  }
}
