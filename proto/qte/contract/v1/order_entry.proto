// Inbound order entry (`schemas/contract/02-inbound-order-entry.md`).
//
// **Version:** 1.3
//
// Message types on the envelope `type` field: `new`, `cancel`, `amend`,
// `mass_cancel`. Every new, cancel, amend and mass-cancel message is released
// to the engine delta_oe after gateway receipt (SPEC 8.1, SPEC 8.2); nothing
// about that timing is a field here.
syntax = "proto3";

package qte.contract.v1;

import "qte/contract/v1/common.proto";

option go_package = "qte-platform/schemas/gen/go/qte/contract/v1;contractv1";

// Creates a new order with the stated size, price and side (SPEC 8.2). A new
// order at a level key (strat_id, instrument, side, price) that already has
// a resting order is rejected, and the existing order is unchanged (SPEC
// 8.2, director follow-up answer G-07). On the missing side of a one-sided
// live quote, an order has no band limit but must have a non-zero price
// (SPEC 5.2, director answer Q-14). While the live quote is empty a limit
// order has no band limit either but must carry a positive price and meet
// the 5% collar at the frozen mark, and a market order with no wall on the
// side it would execute against is rejected (SPEC 5.2, SPEC 8.1, director
// follow-up answer G-17). A NewOrder or AmendOrder released while a
// Director-declared exchange outage is in force is rejected, tested at
// release step 1 with the kill switch, while a CancelOrder and a
// MassCancel are accepted and nothing matches (SPEC 4.3, SPEC 9.4.3,
// director follow-up answer G-18), rejected `EXCHANGE_OUTAGE`
// (`06-reason-codes.md`). Option entitlement and sizing wait for the
// Options section. TODO(#4-D13)
message NewOrder {
  string request_ref = 1;   // id. Client correlation id, echoed on the response. TODO(#4-H2)
  string strat_id = 2;      // id. SPEC 2.5, SPEC 11.3
  string instrument = 3;    // id. SPEC 3.1
  Side side = 4;            // SPEC 8.2
  OrderType order_type = 5; // SPEC 6.3, SPEC 8.1
  // Required iff order_type = LIMIT; absent for MARKET. SPEC 8.2
  optional int64 price = 6; // int64-micro
  int64 size = 7;           // int64-qty, a whole number of shares. SPEC 0.1, SPEC 8.2, G-06
}

// Cancels all of the team's existing orders at the stated price and side,
// across every strategy of the team (SPEC 8.2). Where the level holds orders
// of more than one strategy and any of them is younger than the 50 ms minimum
// rest, the whole message is rejected and nothing is changed; mass-cancel
// stays exempt (SPEC 8.1, director follow-up answer G-09).
message CancelOrder {
  string request_ref = 1; // id. TODO(#4-H2)
  string instrument = 2;  // id. SPEC 8.2
  Side side = 3;          // SPEC 8.2
  int64 price = 4;        // int64-micro. The price level to clear. SPEC 8.2
}

// Changes the price and size of the team's existing orders at the stated
// amend price (SPEC 8.2). `new_size` is the new remaining size, not a
// lifetime total: it is the new total remaining size of the team's orders at
// the level, cut in reverse time priority and added to the most recent order,
// and an amend is never scoped to one strategy. As on a CancelOrder, where
// any of the orders the amend acts on is younger than the 50 ms minimum rest
// the whole message is rejected and nothing is changed (SPEC 8.1, director
// follow-up answer G-09). An order the cut leaves with no size is cancelled
// AMEND_CUT. A new_price where one of the amended strategies already has an
// order is rejected DUPLICATE_ORDER_AT_LEVEL, and one at or beyond the wall on
// the order's own side AMEND_PRICE_AT_OR_BEYOND_WALL; a marketable new_price
// executes each amended order at release, oldest first, each its own
// execution event; a rejected amend leaves every order unchanged (SPEC 8.2,
// director follow-up answer G-08).
// An amend of a STALE order to a lawful price stays STALE with its original
// timer running: the amend keeps the order rather than replacing it
// (SPEC 8.2), and the timer is never reset or stopped once started
// (SPEC 8.4). An amend that would make a STALE order marketable is rejected
// AMEND_WOULD_MAKE_STALE_MARKETABLE, so a STALE order never reaches the wall
// (SPEC 8.2, SPEC 8.4).
message AmendOrder {
  string request_ref = 1; // id. TODO(#4-H2)
  string instrument = 2;  // id. SPEC 8.2
  Side side = 3;          // SPEC 8.2
  int64 price = 4;        // int64-micro. The amend price: the level whose orders change. SPEC 8.2
  int64 new_price = 5;    // int64-micro. Equal to price for a size-only amend. SPEC 8.2
  int64 new_size = 6;     // int64-qty, a whole number of shares. The new remaining size. SPEC 0.1, SPEC 8.2, G-06
}

// Cancels every order the team has on the exchange (SPEC 8.2). Falls into no
// allowance category, ignores the message cap, and is exempt from the
// minimum rest (SPEC 8.1, SPEC 8.2).
message MassCancel {
  string request_ref = 1; // id. TODO(#4-H2)
}
