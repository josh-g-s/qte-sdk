// Inbound order entry.
//
// **Version:** 1.9
//
// Message types on the envelope `type` field: `new`, `cancel`, `amend`,
// `mass_cancel`, and, from a Fundamentals pod only, `ticket`, `ticket_cancel`
// and `ticket_urgency` (see the end of this file). Every new, cancel, amend and mass-cancel message is released
// to the engine delta_oe after gateway receipt (SPEC 8.1, SPEC 8.2); nothing
// about that timing is a field here.
//
// A new or amend of a Market Making, Market Taking, Options MM or Options
// Taking team still waiting out its delay at the term-end trading cutoff is
// dropped with no answer, the way the close drops one: no accept, reject or
// cancel follows (TRADING_CUTOFF and TERM_CUTOFF in common.proto). That "no
// answer" is the Technology Arm's reading of SPEC 13.5, which cancels pending
// submissions and amendments but does not say "without a response".
//
// The book is addressed by instrument, side and price; no inbound message
// carries an order identifier. A team holds at most one resting order per
// instrument, side and price, across all of its strategies (SPEC 8.2).
//
// Identifier limits: request_ref, strat_id, instrument and house_team are each
// at most 32 bytes of UTF-8. The limit counts bytes, not characters, so a character
// outside ASCII counts two to four towards it. Any text is allowed except the
// NUL character. A message with a longer identifier, or one containing NUL,
// is rejected MALFORMED_MESSAGE at receipt, and the reject still echoes
// request_ref as sent. An empty request_ref or strat_id counts as absent and
// is rejected MALFORMED_MESSAGE too. parent_ticket_id, on a NewOrder, is at
// most 32 bytes as well, but narrower: decimal digits only (see NewOrder).
syntax = "proto3";

package qte.contract.v1;

import "qte/contract/v1/common.proto";

option go_package = "qte-platform/schemas/gen/go/qte/contract/v1;contractv1";

// Creates a new order with the stated size, price and side (SPEC 8.2). A new
// order is rejected DUPLICATE_ORDER_AT_LEVEL if the team already has a
// resting order in that instrument, side and price, from any of its
// strategies, and the existing order is unchanged; to change the size of a
// resting order, send an AmendOrder (SPEC 8.2). On the missing side of a
// one-sided live quote, an order has no band limit but must have a non-zero
// price (SPEC 5.2). While the live quote is empty a limit order has no band
// limit either but must carry a positive price and meet the 5% collar at the
// frozen mark, and a market order with no wall on the side it would execute
// against is rejected (SPEC 5.2, SPEC 8.1). A NewOrder or AmendOrder released
// while a Director-declared exchange outage is in force is rejected
// EXCHANGE_OUTAGE, tested at release step 1 with the kill switch, while a
// CancelOrder and a MassCancel are accepted and nothing matches (SPEC 4.3,
// SPEC 9.4.3). An order in an option names the contract by
// Alpaca's OCC option symbol, unpadded, in `instrument` and states `size` in whole
// contracts, not shares (SPEC 18.1).
//
// An Execution desk's order is a child of a working parent ticket assigned
// to the desk, and names that ticket in parent_ticket_id; only an Execution
// desk sets it (SPEC 24, SPEC 24.1). At release the parent controls the
// child: a new that names no working parent ticket assigned to its sender is
// rejected PARENT_NOT_WORKING, which is a desk's new without
// parent_ticket_id and any other team's new with it; one whose instrument or
// side is not the parent's, or whose limit price is beyond the parent's
// limit, PARENT_MISMATCH; and one that would take the parent's filled shares
// plus the shares its outstanding children reserve past the parent quantity,
// PARENT_QUANTITY_EXCEEDED (SPEC 24.1).
message NewOrder {
  string request_ref = 1;   // id, 1 to 32 bytes. Client correlation id, echoed on the response. Its other rules are not yet specified
  string strat_id = 2;      // id, 1 to 32 bytes. SPEC 2.5, SPEC 11.3
  string instrument = 3;    // id, at most 32 bytes. SPEC 3.1
  Side side = 4;            // SPEC 8.2
  OrderType order_type = 5; // SPEC 6.3, SPEC 8.1
  // Required iff order_type = LIMIT; absent for MARKET. SPEC 8.2
  optional int64 price = 6; // int64-micro
  int64 size = 7;           // int64-qty, a whole number of shares, or of contracts for an option. SPEC 0.1, SPEC 8.2, SPEC 18.1
  // Present iff the sender is an Execution desk: the ticket id of the
  // working parent ticket the order works, written in decimal digits only,
  // at most 32 bytes, from 1 to 18446744073709551615. A value present in any
  // other form (empty, 0, a sign, a non-digit, over 32 bytes, or a number
  // past that range) is rejected
  // MALFORMED_MESSAGE at receipt, unless an earlier receipt check fails
  // first. SPEC 24.1
  optional string parent_ticket_id = 8; // id
  // Present iff the sender is a Director session: the team the house order
  // is placed under, at most 32 bytes. Its presence makes the message a house
  // order. A Director session's new without it, or a team session's new with
  // it, is rejected at receipt and not logged. SPEC 14
  optional string house_team = 9; // id
}

// Cancels the team's resting order in the stated instrument at the stated
// price and side, whichever of the team's strategies holds it (SPEC 8.2). An
// order may not be cancelled until 50 ms after its submission, both times
// taken at gateway receipt: an earlier cancel is rejected MIN_REST_VIOLATION
// and nothing is changed; MassCancel is exempt (SPEC 8.1).
message CancelOrder {
  string request_ref = 1; // id, 1 to 32 bytes. Client correlation id. Its other rules are not yet specified
  string instrument = 2;  // id, at most 32 bytes. SPEC 8.2
  Side side = 3;          // SPEC 8.2
  int64 price = 4;        // int64-micro. The price level to clear. SPEC 8.2
  // Present iff the sender is a Director session, as on a NewOrder: the team
  // named on the house order, which acts on the house's own order at the
  // level, whichever team that order is placed under. SPEC 14
  optional string house_team = 5; // id
}

// Changes the price and size of the team's resting order at the stated
// amend price, whichever of the team's strategies holds it (SPEC 8.2).
// `new_size` is the new remaining size, not a lifetime total: an amend from
// 10 to 8 with 5 filled during the delay leaves 8 resting and 13 traded.
// Cutting size keeps the order's queue priority; adding size or changing
// price loses it (SPEC 8.2). As on a CancelOrder, an amend within 50 ms of
// the order's submission is rejected MIN_REST_VIOLATION and nothing is
// changed (SPEC 8.1). A new_price where the team already has another
// resting order in that instrument and side is rejected
// DUPLICATE_ORDER_AT_LEVEL, and one at or beyond the wall on the order's own
// side AMEND_PRICE_AT_OR_BEYOND_WALL; a marketable new_price executes at
// release as an aggressive order at that price, its own execution event; a
// rejected amend leaves the order unchanged (SPEC 6.3, SPEC 8.2).
// An amend of a STALE order to a lawful price stays STALE with its original
// timer running: the amend keeps the order rather than replacing it
// (SPEC 8.2), and the timer is never reset or stopped once started
// (SPEC 8.4). An amend that would make a STALE order marketable is rejected
// AMEND_WOULD_MAKE_STALE_MARKETABLE, so a STALE order never reaches the wall
// (SPEC 8.2, SPEC 8.4).
message AmendOrder {
  string request_ref = 1; // id, 1 to 32 bytes. Client correlation id. Its other rules are not yet specified
  string instrument = 2;  // id, at most 32 bytes. SPEC 8.2
  Side side = 3;          // SPEC 8.2
  int64 price = 4;        // int64-micro. The amend price: the price the order rests at now. SPEC 8.2
  int64 new_price = 5;    // int64-micro. Equal to price for a size-only amend. SPEC 8.2
  int64 new_size = 6;     // int64-qty, a whole number of shares, or of contracts for an option. The new remaining size. SPEC 0.1, SPEC 8.2, SPEC 18.1
  // Present iff the sender is a Director session, as on a CancelOrder. SPEC 14
  optional string house_team = 7; // id
}

// Cancels every order the team has on the exchange (SPEC 8.2). Falls into no
// allowance category, ignores the message cap, and is exempt from the
// minimum rest (SPEC 8.1, SPEC 8.2).
message MassCancel {
  string request_ref = 1; // id, 1 to 32 bytes. Client correlation id. Its other rules are not yet specified
}

// The three ticket messages below: `ticket`, `ticket_cancel` and
// `ticket_urgency`.
//
// Sent by a Fundamentals pod, never by another team: a Fundamentals pod sends
// no orders itself and instead sends its assigned Execution desk a ticket
// (SPEC 2.2, SPEC 23). The ticket is the instruction the desk works.
// Identifier limits are those above: request_ref, instrument and ticket ids
// are at most 32 bytes, with no NUL character, and a ticket id is written in
// decimal digits only, as parent_ticket_id is.

// Submits a ticket to the pod's assigned desk (SPEC 23.2, Table 21). One
// working ticket per instrument; a ticket either increases the position or
// reduces it and never crosses zero (SPEC 23.2). The side is the order's
// side, so a sell that reduces a long is a reducing ticket and a sell that
// opens a short is an increasing one; the exchange works out which from the
// pod's position. An amendment is a replacement: cancel the old ticket with
// a ticket_cancel, then send a new ticket naming it in replaces_ticket_id
// (SPEC 23.2).
//
// An ordinary ticket carries a hard execution limit price. A cure ticket
// (SPEC 23.3) carries none and is flagged cure; its `limit_price` is absent.
message SubmitTicket {
  string request_ref = 1;   // id, 1 to 32 bytes. Client correlation id, echoed on the response
  // Present on an opening or increasing ticket: the filed thesis covering
  // the instrument and side. A reducing ticket inherits the position's
  // thesis and may leave it absent (SPEC 23.1).
  optional string thesis_id = 2; // id, at most 32 bytes
  // Present iff thesis_id is: the version of the thesis the ticket uses,
  // recorded at acceptance (SPEC 23.1, SPEC 23.2).
  optional int32 thesis_version = 3;
  string instrument = 4;    // id, at most 32 bytes. SPEC 3.1
  Side side = 5;            // BUY or SELL. SPEC 23.2
  int64 shares = 6;         // int64-qty, a whole number of shares, positive. SPEC 23.2
  // Required unless cure is set, and absent on a cure ticket: the hard
  // execution limit, a tick multiple. SPEC 23.2, SPEC 23.3
  optional int64 limit_price = 7; // int64-micro
  TicketUrgency urgency = 8;  // SPEC 23.2
  // Optional free text for the desk, at most 280 characters, with no NUL
  // character. Visible to the desk and logged; unscored. SPEC 23.2
  optional string notes = 9;
  // Present when this ticket replaces one the pod cancelled: the ticket_id of
  // that cancelled ticket of the same pod in the same instrument. Absent on a
  // cure ticket, whose acceptance replaces any ordinary reducing ticket in the
  // instrument by itself. SPEC 23.2, SPEC 23.3
  optional string replaces_ticket_id = 10; // id, decimal digits only
  // Present and true on a cure ticket; absent means an ordinary ticket.
  // SPEC 23.3
  optional bool cure = 11;
}

// Cancels one of the pod's own ordinary tickets that is still working. The
// pod may cancel an ordinary ticket at any time; a cure ticket cannot be
// cancelled by the pod (SPEC 23.2, SPEC 23.3). The remainder is cancelled,
// the desk's children are cancelled with it and committed fills stand
// (SPEC 24.1). The desk may never cancel or amend a ticket (SPEC 23.2).
message CancelTicket {
  string request_ref = 1; // id, 1 to 32 bytes. Client correlation id, echoed on the response
  string ticket_id = 2;   // id, decimal digits only. The ticket to cancel
}

// Raises the urgency of the pod's working cure ticket. A cure ticket's
// urgency may only increase, and the change applies to the remaining
// schedule from then on, not to what is already due (SPEC 23.3).
message RaiseTicketUrgency {
  string request_ref = 1; // id, 1 to 32 bytes. Client correlation id, echoed on the response
  string ticket_id = 2;   // id, decimal digits only. The cure ticket
  TicketUrgency urgency = 3; // Higher than the ticket's current urgency. SPEC 23.3
}
