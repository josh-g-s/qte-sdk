// The envelope that wraps every message on the wire.
//
// **Version:** 1.3
//
// Status: PROVISIONAL. The session layer is partly specified: the sequence
// numbers, heartbeats and resume are decided, while the rest of the envelope
// and the handshake are still a working proposal that may change. The
// transport and encoding are decided: WebSocket, JSON messages, with these
// `.proto` files as the schema source and the canonical protobuf JSON
// mapping.
syntax = "proto3";

package qte.contract.v1;

import "google/protobuf/struct.proto";

option go_package = "qte-platform/schemas/gen/go/qte/contract/v1;contractv1";

// Wraps every message on the wire.
message Envelope {
  // string. The contract version the message conforms to. How versions are
  // numbered and changed is not yet specified.
  string version = 1;
  // Message kind: one of the message-type tokens named at the top of
  // `session.proto`, `order_entry.proto`, `order_events.proto` and
  // `market_data.proto`, for example `new` or `book`. Left a `string`
  // rather than a proto enum on purpose: a new message type is meant to be
  // an additive change, and a new value in a closed enum would make it a
  // breaking one. The contract's versioning rules are not yet specified.
  string type = 2;
  // Required on outbound; absent on inbound. Strictly increasing per
  // connection, for gap detection only: a client uses it to notice a
  // message it has missed on that connection, never to resume (see
  // report_seq). Unrelated to the exchange's own event ordering (SPEC 20.2).
  // Deliberately int32, not int64: it is a transport counter, so it stays an
  // ordinary JSON number rather than the decimal string the JSON mapping
  // uses for 64-bit fields.
  optional int32 seq = 3;
  // timestamp. Required on outbound: the server's send time, a signed 64-bit
  // count of milliseconds since the Unix epoch, UTC (SPEC 8.1, SPEC 13.1),
  // carried as a decimal string. Part of the session layer, whose rules are
  // not otherwise specified yet.
  optional int64 sent_at = 4;
  // The type-specific body. `google.protobuf.Struct` stands in for a JSON
  // object while the session layer, and so the typed union this might
  // become, is not yet specified. The payload's own message type
  // (NewOrder, Accepted, Book, and so on, in the sibling `.proto` files)
  // defines its shape; this field does not itself enforce that shape.
  google.protobuf.Struct payload = 5;
  // integer. The team's report sequence number: present if and only if the
  // message is one of the team's private order reports that a resume can
  // replay (`accepted`, a `reject` sent after the order's delay, `execution`,
  // `order_cancelled`, `order_state` and `risk_notice`), and absent on every
  // other message. Per team, starting at 1 for the term, increasing by
  // exactly one for each such report, with no gaps. A replayed report carries
  // the number it was first sent with. Carried on the envelope, not in the
  // payload, so a replayed payload is identical to the original. A 64-bit
  // value, so on the wire it is the decimal string the JSON mapping uses for
  // 64-bit fields.
  optional int64 report_seq = 6;
}
