name: Task
description: A unit of QTE build work
title: "[task] "
body:
  - type: dropdown
    id: workstream
    attributes:
      label: Workstream
      description: Which workstream does this belong to? (Delivery Plan Section 3)
      options:
        - A - Market data ingest & synthetic book
        - B - Matching engine & order book
        - C - Gateway, OMS, audit
        - D - Risk engine
        - E - Trading front-ends
        - F - Metrics, PnL, leaderboards
        - G - Backtester & replay
        - H - Options
        - I - Agentic AI & bot fleet
        - J - Cloud, DevOps, ops
        - K - QA & release
    validations:
      required: true
  - type: dropdown
    id: priority
    attributes:
      label: Priority
      description: Draft 5 Table 28 dependency layer, if known
      options:
        - P1
        - P2
        - T2
        - T3
        - triage
      default: 4
  - type: textarea
    id: what
    attributes:
      label: What and why
      description: What needs to be done. Cite Draft 5 sections and tables where relevant.
    validations:
      required: true
  - type: textarea
    id: done
    attributes:
      label: Done when
      description: Testable completion criteria (acceptance-criteria template applies).
    validations:
      required: true
