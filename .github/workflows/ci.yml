name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: pip install -e ".[dev]"
      - run: ruff check .
      - run: ruff format --check .

  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12", "3.13", "3.14"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - run: pip install -e ".[dev]"
      - run: pytest

  windows:
    # The Windows token-file and console checks (tests marked `windows`) read real access
    # lists, owners and consoles, so they run only here. The rest of the suite runs too; the
    # few tests that cannot run on Windows skip themselves and say why. The contract code is
    # regenerated as well. See "Windows" in docs/development.md.
    runs-on: windows-latest
    timeout-minutes: 30
    steps:
      # Checked out with the runner's default core.autocrlf: .gitattributes keeps the
      # vendored contract's bytes exact, and the tests hash them, and checks the generated
      # contract code out with LF, which the last step checks.
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: pip install -e ".[dev,codegen]"
      - name: Run the tests marked windows
        run: pytest -m windows --junitxml=windows-tests.xml
      # Every test in tests/test_windows_real.py, marked or not, and every test marked
      # windows anywhere, must be in the report by name, and none skipped. The script lists
      # them in a pytest process of its own, before any filter, so a test that loses its
      # mark, or that -k, --deselect or a conftest hook leaves out, fails the job.
      - name: Fail if a Windows test did not run or was skipped
        run: python scripts/check_windows_tests.py windows-tests.xml
      - name: Run the rest of the suite
        if: success() || failure()
        run: pytest -m "not windows"
      # scripts/generate_contract.py must write LF here too, so a regeneration on Windows
      # leaves the committed code unchanged. git diff ignores CRLF in a file .gitattributes
      # marks as text, so scripts/check_contract_eol.py checks the bytes as well, before and
      # after: every generated file must be listed, with LF, and an empty listing fails.
      - name: Regenerate the contract code and fail if it changes or is not LF
        if: success() || failure()
        shell: bash
        run: |
          python scripts/check_contract_eol.py
          python scripts/generate_contract.py
          python scripts/check_contract_eol.py
          git status --porcelain qte_sdk/contract
          git diff --exit-code qte_sdk/contract
          test -z "$(git status --porcelain qte_sdk/contract)"

  windows-install:
    # The install students are told to use on Windows, tested as they do it: the wheel, the
    # sdist and a zip of the source tree as the release download is, each installed into a
    # fresh virtualenv in a folder whose path has a space and a non-ASCII character, and the
    # SDK run from outside the checkout, from Git Bash and cmd as well as PowerShell. CI's
    # own temp folder is a short ASCII name, so without this no path like a student's ever
    # occurs. Not a required check. See "Windows" in docs/development.md.
    #
    # STUDENT_HOME, the student's folder, is set on each step that needs it (the runner
    # context, which gives the temp folder, is not available to a job's env) and is read
    # from the environment, never written in a step's script: cmd reads its script in the
    # console's code page, which cannot hold the Ü, but expands a variable as it is.
    runs-on: windows-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: pip install build
      - run: python -m build
      # GitHub's release download is a zip of the tree at the tag, in one folder named after
      # it, which pip installs with no git. git archive makes the same zip of this commit.
      - name: Make a zip of the source tree, as the release download is
        shell: bash
        run: git archive --format=zip --prefix=qte-sdk-main/ -o dist/qte-sdk-main.zip HEAD
      # For each of the three: a fresh virtualenv in "Student Ü", installed with its own pip,
      # and then, from a folder outside the checkout: the qte_sdk imported is the installed
      # one; `python -m qte_sdk.update --json` exits 0, 1 or 2 (it may have no network) with
      # one JSON document; `python -m qte_sdk.agents` exits 0 and prints AGENTS.md; and
      # `python -m qte_sdk.token check` with no token exits 1 with QTE-TOKEN-MISSING. The
      # script sets nothing that changes how Python encodes its output, and prints the
      # encodings each run used.
      - name: Install the wheel, the sdist and the zip in a folder with a space and a Ü
        shell: bash
        env:
          STUDENT_HOME: ${{ runner.temp }}\Student Ü
        run: |
          python scripts/check_student_install.py install wheel dist/*.whl
          python scripts/check_student_install.py install sdist dist/*.tar.gz
          python scripts/check_student_install.py install zip dist/qte-sdk-main.zip
      # From Git Bash, as students who use it run the SDK, with the wheel's virtualenv: each
      # example's --help must exit 0 with a usage: line, and `python -m qte_sdk.update` exit
      # 0, 1 or 2 with its result on one line (the QTE-UPDATE-AVAILABLE line when behind).
      # The shell starts the SDK itself; the script only reads what it wrote.
      - name: Run the examples' --help and the update check from Git Bash
        if: success() || failure()
        shell: bash
        working-directory: ${{ runner.temp }}
        env:
          STUDENT_HOME: ${{ runner.temp }}\Student Ü
        run: |
          python_exe="$(cygpath -u "$STUDENT_HOME")/wheel/Scripts/python.exe"
          for example in "$GITHUB_WORKSPACE"/examples/*.py; do
            name=$(basename "$example" .py)
            "$python_exe" "$example" --help > "help-bash-$name.txt" 2>&1 || { echo "$name --help exited $?"; cat "help-bash-$name.txt"; exit 1; }
          done
          python "$GITHUB_WORKSPACE/scripts/check_student_install.py" help help-bash-
          code=0
          "$python_exe" -m qte_sdk.update --timeout 5 > update-bash.txt || code=$?
          python "$GITHUB_WORKSPACE/scripts/check_student_install.py" update update-bash.txt "$code"
      # The same from cmd, whose console code page (437 or 1252, which chcp prints) is not
      # UTF-8. %errorlevel% is read only outside the for loop, where cmd expands it after
      # the line before has run; inside it, || stops the step at a failed --help.
      - name: Run the examples' --help and the update check from cmd
        if: success() || failure()
        shell: cmd
        working-directory: ${{ runner.temp }}
        env:
          STUDENT_HOME: ${{ runner.temp }}\Student Ü
        run: |
          chcp
          for %%f in ("%GITHUB_WORKSPACE%\examples\*.py") do "%STUDENT_HOME%\wheel\Scripts\python.exe" "%%~f" --help > "help-cmd-%%~nf.txt" 2>&1 || (echo %%~nf --help failed & type "help-cmd-%%~nf.txt" & exit /b 1)
          python "%GITHUB_WORKSPACE%\scripts\check_student_install.py" help help-cmd- || exit /b 1
          "%STUDENT_HOME%\wheel\Scripts\python.exe" -m qte_sdk.update --timeout 5 > update-cmd.txt
          python "%GITHUB_WORKSPACE%\scripts\check_student_install.py" update update-cmd.txt %errorlevel%

  test-websockets-floor:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install with the oldest websockets that pyproject.toml allows
        run: pip install -e ".[dev]" "websockets==15.0"
      - name: Confirm the floor version is the one installed
        run: python -c "import websockets; print(websockets.__version__); assert websockets.__version__ == '15.0', websockets.__version__"
      - run: pytest

  wheel:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: pip install build
      - run: python -m build
      - name: Install the wheel into a clean virtualenv and import it
        run: |
          python -m venv /tmp/wheel-venv
          /tmp/wheel-venv/bin/pip install dist/*.whl
          cd /tmp
          /tmp/wheel-venv/bin/python -c "import qte_sdk; print(qte_sdk.__version__)"
          /tmp/wheel-venv/bin/python -c "from qte_sdk.contract import codec; from qte_sdk.contract.v1 import envelope_pb2, market_data_pb2, order_entry_pb2, order_events_pb2, session_pb2"
          /tmp/wheel-venv/bin/python -c "from qte_sdk.connection import Connection"
      - name: Run the test suite from the unpacked sdist in a clean virtualenv
        run: |
          mkdir "$RUNNER_TEMP/sdist"
          tar -xzf dist/*.tar.gz -C "$RUNNER_TEMP/sdist"
          python -m venv "$RUNNER_TEMP/sdist-venv"
          cd "$RUNNER_TEMP"/sdist/qte_sdk-*
          "$RUNNER_TEMP/sdist-venv/bin/pip" install ".[dev]"
          "$RUNNER_TEMP/sdist-venv/bin/pytest"

  contract-drift:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: pip install -e ".[dev,codegen]"
      - run: python scripts/generate_contract.py
      - name: Fail if the committed generated code differs from the vendored protos
        run: |
          git status --porcelain qte_sdk/contract
          git diff --exit-code qte_sdk/contract
          test -z "$(git status --porcelain qte_sdk/contract)"
