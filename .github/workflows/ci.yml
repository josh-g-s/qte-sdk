name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: pip install -e ".[dev]"
      - run: ruff check .
      - run: ruff format --check .

  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12", "3.13", "3.14"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - run: pip install -e ".[dev]"
      - run: pytest

  windows:
    # The Windows token-file and console checks (tests marked `windows`) read real access
    # lists, owners and consoles, so they run only here. The rest of the suite runs too; the
    # few tests that cannot run on Windows skip themselves and say why. See "Windows" in
    # docs/development.md.
    runs-on: windows-latest
    timeout-minutes: 30
    steps:
      # Checked out with the runner's default core.autocrlf: .gitattributes keeps the
      # vendored contract's bytes exact, and the tests hash them.
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: pip install -e ".[dev]"
      - name: Run the tests marked windows
        run: pytest -m windows --junitxml=windows-tests.xml
      # Every test in tests/test_windows_real.py, marked or not, and every test marked
      # windows anywhere, must be in the report by name, and none skipped. The script lists
      # them in a pytest process of its own, before any filter, so a test that loses its
      # mark, or that -k, --deselect or a conftest hook leaves out, fails the job.
      - name: Fail if a Windows test did not run or was skipped
        run: python scripts/check_windows_tests.py windows-tests.xml
      - name: TEMP issue 168 diagnosis
        if: success() || failure()
        continue-on-error: true
        shell: bash
        run: |
          pip install pytest-timeout
          python scripts/diag_windows_168.py
          for i in 1 2 3 4 5; do
            echo "=== repeat $i"
            pytest -q -p no:cacheprovider --timeout=90 tests/test_reconnect.py tests/test_resume.py tests/test_calendar.py tests/test_instruments.py tests/test_new_message_types.py tests/test_tickets.py 2>&1 | tail -8
          done
      - name: Run the rest of the suite
        if: success() || failure()
        run: pytest -m "not windows"

  test-websockets-floor:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install with the oldest websockets that pyproject.toml allows
        run: pip install -e ".[dev]" "websockets==15.0"
      - name: Confirm the floor version is the one installed
        run: python -c "import websockets; print(websockets.__version__); assert websockets.__version__ == '15.0', websockets.__version__"
      - run: pytest

  wheel:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: pip install build
      - run: python -m build
      - name: Install the wheel into a clean virtualenv and import it
        run: |
          python -m venv /tmp/wheel-venv
          /tmp/wheel-venv/bin/pip install dist/*.whl
          cd /tmp
          /tmp/wheel-venv/bin/python -c "import qte_sdk; print(qte_sdk.__version__)"
          /tmp/wheel-venv/bin/python -c "from qte_sdk.contract import codec; from qte_sdk.contract.v1 import envelope_pb2, market_data_pb2, order_entry_pb2, order_events_pb2, session_pb2"
          /tmp/wheel-venv/bin/python -c "from qte_sdk.connection import Connection"
      - name: Run the test suite from the unpacked sdist in a clean virtualenv
        run: |
          mkdir "$RUNNER_TEMP/sdist"
          tar -xzf dist/*.tar.gz -C "$RUNNER_TEMP/sdist"
          python -m venv "$RUNNER_TEMP/sdist-venv"
          cd "$RUNNER_TEMP"/sdist/qte_sdk-*
          "$RUNNER_TEMP/sdist-venv/bin/pip" install ".[dev]"
          "$RUNNER_TEMP/sdist-venv/bin/pytest"

  contract-drift:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: pip install -e ".[dev,codegen]"
      - run: python scripts/generate_contract.py
      - name: Fail if the committed generated code differs from the vendored protos
        run: |
          git status --porcelain qte_sdk/contract
          git diff --exit-code qte_sdk/contract
          test -z "$(git status --porcelain qte_sdk/contract)"
