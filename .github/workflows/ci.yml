name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: pip install -e ".[dev]"
      - run: ruff check .
      - run: ruff format --check .

  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12", "3.13", "3.14"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - run: pip install -e ".[dev]"
      - run: pytest

  windows:
    # The Windows token-file and console checks (tests marked `windows`) read real access
    # lists, owners and consoles, so they run only here. The rest of the suite runs too,
    # except the files below, which do not work on Windows yet. See "Windows" in
    # docs/development.md.
    runs-on: windows-latest
    timeout-minutes: 30
    steps:
      # Check out the vendored contract with its exact bytes, which the tests hash.
      - run: git config --global core.autocrlf false
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: pip install -e ".[dev]"
      - name: Run the tests marked windows
        run: pytest -m windows --junitxml=windows-tests.xml
      # Every test in tests/test_windows_real.py, marked or not, and every test marked
      # windows anywhere, must be in the report by name, and none skipped, so a test that
      # loses its mark fails the job. The tests are collected in this process, so the
      # check does not depend on how pytest prints them.
      - name: Fail if a Windows test did not run or was skipped
        shell: python
        run: |
          import xml.etree.ElementTree as ET

          import pytest

          MODULE = "tests/test_windows_real.py"


          class Expected:
              """Collects the node IDs of the tests that must run: every test in MODULE, marked or
              not, and every test marked windows anywhere."""

              def __init__(self):
                  self.ids = []

              def pytest_collection_finish(self, session):
                  self.ids = [
                      item.nodeid
                      for item in session.items
                      if item.nodeid.startswith(MODULE + "::") or item.get_closest_marker("windows")
                  ]


          def junit_key(nodeid):
              """The (classname, name) pytest's JUnit report gives the test with `nodeid`."""
              path, *rest = nodeid.split("::")
              module = path.removesuffix(".py").replace("/", ".")
              return ".".join([module, *rest[:-1]]), rest[-1]


          expected = Expected()
          code = pytest.main(["--collect-only", "-q", "-p", "no:cacheprovider", "tests"], plugins=[expected])
          report = "windows-tests.xml"
          cases = {(c.get("classname"), c.get("name")): c for c in ET.parse(report).getroot().iter("testcase")}
          skipped = sorted(f"{k[0]}::{k[1]}" for k, c in cases.items() if c.find("skipped") is not None)
          missing = sorted(i for i in expected.ids if junit_key(i) not in cases)
          print(f"{len(cases)} ran, {len(skipped)} skipped; {len(expected.ids)} expected")
          assert code == 0, f"collecting the tests failed ({code})"
          assert expected.ids, "no test was collected from " + MODULE
          assert not skipped, f"skipped: {skipped}"
          assert not missing, f"did not run: {missing}"
      # Left out:
      # - test_reconnect, test_resume, test_calendar, test_instruments,
      #   test_new_message_types and test_tickets: their fake exchange drops a connection
      #   with transport.abort(), and on Windows the reset discards the frames sent just
      #   before it, so the client sees the drop a message early; one test hangs.
      # - test_history: its cancellation and TLS shutdown tests time out on Windows.
      # - test_examples: it sends SIGINT to child processes and uses preexec_fn, which
      #   Windows does not have.
      - name: Run the rest of the suite
        if: success() || failure()
        run: >-
          pytest -m "not windows"
          --ignore=tests/test_reconnect.py
          --ignore=tests/test_resume.py
          --ignore=tests/test_calendar.py
          --ignore=tests/test_instruments.py
          --ignore=tests/test_new_message_types.py
          --ignore=tests/test_tickets.py
          --ignore=tests/test_history.py
          --ignore=tests/test_examples.py

  test-websockets-floor:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install with the oldest websockets that pyproject.toml allows
        run: pip install -e ".[dev]" "websockets==15.0"
      - name: Confirm the floor version is the one installed
        run: python -c "import websockets; print(websockets.__version__); assert websockets.__version__ == '15.0', websockets.__version__"
      - run: pytest

  wheel:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: pip install build
      - run: python -m build
      - name: Install the wheel into a clean virtualenv and import it
        run: |
          python -m venv /tmp/wheel-venv
          /tmp/wheel-venv/bin/pip install dist/*.whl
          cd /tmp
          /tmp/wheel-venv/bin/python -c "import qte_sdk; print(qte_sdk.__version__)"
          /tmp/wheel-venv/bin/python -c "from qte_sdk.contract import codec; from qte_sdk.contract.v1 import envelope_pb2, market_data_pb2, order_entry_pb2, order_events_pb2, session_pb2"
          /tmp/wheel-venv/bin/python -c "from qte_sdk.connection import Connection"
      - name: Run the test suite from the unpacked sdist in a clean virtualenv
        run: |
          mkdir "$RUNNER_TEMP/sdist"
          tar -xzf dist/*.tar.gz -C "$RUNNER_TEMP/sdist"
          python -m venv "$RUNNER_TEMP/sdist-venv"
          cd "$RUNNER_TEMP"/sdist/qte_sdk-*
          "$RUNNER_TEMP/sdist-venv/bin/pip" install ".[dev]"
          "$RUNNER_TEMP/sdist-venv/bin/pytest"

  contract-drift:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: pip install -e ".[dev,codegen]"
      - run: python scripts/generate_contract.py
      - name: Fail if the committed generated code differs from the vendored protos
        run: |
          git status --porcelain qte_sdk/contract
          git diff --exit-code qte_sdk/contract
          test -z "$(git status --porcelain qte_sdk/contract)"
